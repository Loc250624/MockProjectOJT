spring.application.name=elearning

# Import local secrets FIRST so that all overrides below are available
# before any placeholder is evaluated.  The file is git-ignored; each
# developer keeps their own copy.  See application.secret.properties.example.
spring.config.import=optional:classpath:application.secret.properties

# DB configuration
# spring.datasource.username and spring.datasource.password are provided by
# application.secret.properties (or environment variables DB_USERNAME / DB_PASSWORD).
spring.datasource.url=jdbc:mysql://localhost:3306/mock_project?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:123456}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.show_sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# Logging is quiet by default to avoid leaking identifiers, SQL column names,
# callback payloads, or token material in normal app/test output.
# Use the local-debug profile when detailed local diagnostics are needed.
debug=${APP_DEBUG:false}
logging.level.root=${LOG_LEVEL_ROOT:INFO}
logging.level.org.springframework=${LOG_LEVEL_SPRING:INFO}
logging.level.org.hibernate.SQL=${LOG_LEVEL_HIBERNATE_SQL:INFO}
logging.level.org.hibernate.orm.jdbc.bind=${LOG_LEVEL_HIBERNATE_BIND:INFO}

server.port=8080
server.servlet.session.persistent=false
spring.devtools.livereload.enabled=${DEVTOOLS_LIVERELOAD:false}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
app.upload.avatar-directory=uploads/avatars
app.upload.avatar-max-size=5242880
app.avatar.remote-timeout=5000
app.avatar.remote-max-size=5242880
app.code-judge.timeout-ms=5000

# AI Tutor server-side OpenAI Responses API integration.
# OPENAI_API_KEY must be supplied from an environment variable or the ignored
# application.secret.properties file. It is never exposed to the browser.
app.ai-tutor.enabled=${AI_TUTOR_ENABLED:true}
app.ai-tutor.api-key=${OPENAI_API_KEY}
app.ai-tutor.base-url=${OPENAI_BASE_URL}
app.ai-tutor.model=${OPENAI_MODEL}
app.ai-tutor.timeout-ms=${AI_TUTOR_TIMEOUT_MS:8000}
app.ai-tutor.max-message-chars=${AI_TUTOR_MAX_MESSAGE_CHARS:1200}
app.ai-tutor.max-history-turns=${AI_TUTOR_MAX_HISTORY_TURNS:6}
app.ai-tutor.max-history-chars=${AI_TUTOR_MAX_HISTORY_CHARS:700}
app.ai-tutor.max-context-chars=${AI_TUTOR_MAX_CONTEXT_CHARS:6000}
app.ai-tutor.max-output-tokens=${AI_TUTOR_MAX_OUTPUT_TOKENS:700}
app.ai-tutor.rate-limit-max-requests=${AI_TUTOR_RATE_LIMIT_MAX_REQUESTS:12}
app.ai-tutor.rate-limit-window-seconds=${AI_TUTOR_RATE_LIMIT_WINDOW_SECONDS:60}

# Teacher-only question generation. This has a separate client, timeout, retry
# budget, and rate limit from the Student AI Tutor.
app.question-generation.enabled=${QUESTION_GENERATION_ENABLED:false}
app.question-generation.api-key=${QUESTION_GENERATION_API_KEY:${OPENAI_API_KEY:}}
app.question-generation.base-url=${QUESTION_GENERATION_BASE_URL:https://api.openai.com}
app.question-generation.model=${QUESTION_GENERATION_MODEL:gpt-5.6-sol}
app.question-generation.timeout-ms=${QUESTION_GENERATION_TIMEOUT_MS:30000}
app.question-generation.max-retries=${QUESTION_GENERATION_MAX_RETRIES:2}
app.question-generation.rate-limit-per-minute=${QUESTION_GENERATION_RATE_LIMIT_PER_MINUTE:5}

# Thymeleaf configuration
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8

# Feedback receipt email. Real credentials must come from environment variables
# or application.secret.properties, never from committed source.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

app.feedback-email.enabled=${FEEDBACK_EMAIL_ENABLED:true}
app.feedback-email.from=${FEEDBACK_EMAIL_FROM:${MAIL_USERNAME:}}
app.feedback-email.from-name=${FEEDBACK_EMAIL_FROM_NAME:Lumina Learning}
app.feedback-email.reply-to=${FEEDBACK_EMAIL_REPLY_TO:}
app.feedback-email.support-email=${SUPPORT_EMAIL:}
app.feedback-email.banner=classpath:/mail/lumina-feedback-email-banner.png

# OAuth2 Configuration
# Values come from application.secret.properties (local dev) or environment
# variables GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET / GITHUB_CLIENT_ID /
# GITHUB_CLIENT_SECRET (CI / production).
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:UNCONFIGURED_GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:UNCONFIGURED_GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID:UNCONFIGURED_GITHUB_CLIENT_ID}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET:UNCONFIGURED_GITHUB_CLIENT_SECRET}
spring.security.oauth2.client.registration.github.scope=read:user,user:email

app.base-url=${APP_BASE_URL:http://localhost:8080}

