spring.application.name=elearning

# Active Profile Selection: Defaults to 'dev' for local execution.
# Railway sets SPRING_PROFILES_ACTIVE=prod to activate application-prod.properties.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Import local secret overrides if present (Git-ignored)
spring.config.import=optional:classpath:application.secret.properties

# Server Port & Reverse Proxy Header Settings
server.port=${PORT:8080}
server.forward-headers-strategy=native
server.servlet.session.persistent=false

# Upload & Resource Limits
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
app.upload.avatar-directory=uploads/avatars
app.upload.avatar-max-size=5242880
app.avatar.remote-timeout=5000
app.avatar.remote-max-size=5242880
app.code-judge.timeout-ms=5000

# Logging Defaults
debug=${APP_DEBUG:false}
logging.level.root=${LOG_LEVEL_ROOT:INFO}
logging.level.org.springframework=${LOG_LEVEL_SPRING:INFO}
logging.level.org.hibernate.SQL=${LOG_LEVEL_HIBERNATE_SQL:INFO}

# Thymeleaf Template Engine Configuration
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8
