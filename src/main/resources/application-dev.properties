# Local Development Configuration Profile (spring.profiles.active=dev)

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/mock_project?useSSL=false&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Ho_Chi_Minh}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

app.seed.enabled=${APP_SEED_ENABLED:false}

app.security.cookie-secure=false
jwt.secret=${JWT_SECRET:dev-only-local-test-secret-key-minimum-256-bits}
jwt.expiration=${JWT_EXPIRATION_MS:86400000}

app.base-url=${APP_BASE_URL:http://localhost:8080}

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:5173}

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:test-google-client-id.apps.googleusercontent.com}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID:test-github-client-id}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET:}
spring.security.oauth2.client.registration.github.scope=read:user,user:email

payment.gateway.momo.partnerCode=${MOMO_PARTNER_CODE:}
payment.gateway.momo.accessKey=${MOMO_ACCESS_KEY:}
payment.gateway.momo.secretKey=${MOMO_SECRET_KEY:}
payment.gateway.momo.endpoint=https://test-payment.momo.vn/v2/gateway/api/create
payment.gateway.momo.returnUrl=${app.base-url}/student/payment-result
payment.gateway.momo.ipnUrl=${app.base-url}/api/payment/webhook

payment.gateway.vnpay.tmnCode=${VNPAY_TMN_CODE:}
payment.gateway.vnpay.hashSecret=${VNPAY_HASH_SECRET:}
payment.gateway.vnpay.endpoint=https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
payment.gateway.vnpay.returnUrl=${app.base-url}/student/payment-result
payment.gateway.vnpay.ipnUrl=${app.base-url}/api/payment/vnpay-ipn

payment.gateway.exchange-rate=25000

server.error.include-stacktrace=always
server.error.include-message=always
