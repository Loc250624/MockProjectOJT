<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit Assignment</title>
    <link rel="stylesheet" th:href="@{/css/lumina-design-system.css}">
    <link rel="stylesheet" th:href="@{/css/student/student.css}">
</head>
<body class="lumina-bg assessment-page" th:attr="data-assignment-id=${submission != null ? submission.assignmentId : ''}">
<header th:replace="~{fragments/layout :: header('student')}"></header>
<main class="assessment-shell single">
    <section class="assessment-panel" th:if="${submission != null}">
        <div class="assessment-heading">
            <div>
                <p class="eyebrow">Assignment</p>
                <h1 th:text="${submission.assignmentTitle}">Assignment</h1>
            </div>
            <a class="btn btn-secondary" th:href="@{/student/results}">
                <svg th:replace="~{fragments/icons :: icon('approve')}"></svg>
                <span>Results</span>
            </a>
        </div>
        <form id="assignment-submit-form" class="assessment-form">
            <label>
                Notes or answer
                <textarea name="contentText" rows="5" th:text="${submission.contentText}" placeholder="Describe your approach or paste your written answer."></textarea>
            </label>
            <label>
                Language
                <input name="codeLanguage" th:value="${submission.codeLanguage}" placeholder="Java, Python, JavaScript">
            </label>
            <label>
                Code
                <textarea name="codeContent" rows="12" th:text="${submission.codeContent}" placeholder="Paste code here for code assignments."></textarea>
            </label>
            <label>
                File URL or path
                <input name="filePath" th:value="${submission.filePath}" placeholder="/uploads/submissions/file.zip">
            </label>
            <div class="assessment-actions">
                <button class="btn btn-secondary" type="button" id="save-assignment-draft">
                    <svg th:replace="~{fragments/icons :: icon('save')}"></svg>
                    <span>Save draft</span>
                </button>
                <button class="btn btn-primary" type="submit">
                    <svg th:replace="~{fragments/icons :: icon('approve')}"></svg>
                    <span>Submit</span>
                </button>
            </div>
            <div class="assessment-message" id="assignment-message"></div>
        </form>
    </section>
    <section class="empty-state" th:unless="${submission != null}">
        <div class="empty-state-icon"><svg th:replace="~{fragments/icons :: icon('code')}"></svg></div>
        <div class="empty-title">Assignment data is unavailable.</div>
    </section>
</main>
<script th:src="@{/js/student/student.js}"></script>
</body>
</html>
