<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assessment Results</title>
    <link rel="stylesheet" th:href="@{/css/lumina-design-system.css}">
    <link rel="stylesheet" th:href="@{/css/student/student.css}">
</head>
<body>
<header th:replace="~{fragments/layout :: header('student')}"></header>
<div class="layout-container">
    <aside th:replace="~{fragments/layout :: sidebar-student}"></aside>
    <main class="main-content assessment-content">
        <h1>Assessment Results</h1>
        <section class="assessment-panel">
            <h2>Quizzes</h2>
            <div class="empty-state" th:if="${results == null || #lists.isEmpty(results.quizAttempts)}">
                <div class="empty-state-icon"><svg th:replace="~{fragments/icons :: icon('approve')}"></svg></div>
                <div class="empty-title">No quiz results yet.</div>
            </div>
            <div class="assessment-list" th:unless="${results == null || #lists.isEmpty(results.quizAttempts)}">
                <a class="result-row" th:each="attempt : ${results.quizAttempts}" th:href="@{/student/quizzes/{id}/result(id=${attempt.id})}">
                    <span th:text="${attempt.quiz.title}">Quiz</span>
                    <strong th:text="${attempt.score != null ? attempt.score + '%' : attempt.status}">Score</strong>
                </a>
            </div>
        </section>
        <section class="assessment-panel">
            <h2>Assignments</h2>
            <div class="empty-state" th:if="${results == null || #lists.isEmpty(results.submissions)}">
                <div class="empty-state-icon"><svg th:replace="~{fragments/icons :: icon('code')}"></svg></div>
                <div class="empty-title">No assignment submissions yet.</div>
            </div>
            <div class="assessment-list" th:unless="${results == null || #lists.isEmpty(results.submissions)}">
                <a class="result-row" th:each="submission : ${results.submissions}" th:href="@{/student/submissions/{id}/result(id=${submission.id})}">
                    <span th:text="${submission.assignmentTitle}">Assignment</span>
                    <strong th:text="${submission.released == true && submission.score != null ? submission.score + '%' : submission.status}">Status</strong>
                </a>
            </div>
        </section>
    </main>
</div>
<div th:replace="~{fragments/ai-chatbot :: widget}"></div>
<script th:src="@{/js/student/student.js}"></script>
</body>
</html>
