<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browse Courses - Student - OJTSU26 E-Learning</title>
    <link rel="stylesheet" th:href="@{/css/student/student.css}">
</head>
<body>
    <header th:replace="~{fragments/layout :: header('student')}"></header>
    <div class="layout-container">
        <aside th:replace="~{fragments/layout :: sidebar-student}"></aside>
        <main class="main-content">
            <h1>Browse Courses</h1>

            <!-- Flash messages -->
            <div th:if="${errorMessage}" style="margin-bottom:1rem;padding:0.75rem 1rem;background:#fef2f2;border:1px solid #fca5a5;border-radius:8px;color:#dc2626;font-size:0.875rem;font-weight:500;" th:text="${errorMessage}"></div>

            <!-- Unified Search & Filter Form for Student Portal -->
            <form th:action="@{/student/courses}" method="get">
                <div class="action-bar">
                    <div class="search-bar" style="display: flex; flex: 1;">
                        <input type="text" name="keyword" th:value="${keyword}" placeholder="Search courses...">
                        <button type="submit" class="btn btn-primary">Search</button>
                    </div>
                    <div style="display: flex; gap: 1rem; align-items: center;">
                        <select name="categoryId" onchange="this.form.submit()" class="form-select" style="padding: 0.5rem; border: 1px solid #ddd; border-radius: 4px; cursor:pointer;">
                            <option value="">All Categories</option>
                            <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}" th:selected="${cat.id == selectedCategoryId}"></option>
                        </select>
                        <select name="sortBy" onchange="this.form.submit()" class="form-select" style="padding: 0.5rem; border: 1px solid #ddd; border-radius: 4px; cursor:pointer;">
                            <option value="newest" th:selected="${sortBy == 'newest'}">Newest</option>
                            <option value="price-low" th:selected="${sortBy == 'price-low'}">Price: Low to High</option>
                            <option value="price-high" th:selected="${sortBy == 'price-high'}">Price: High to Low</option>
                            <option value="title" th:selected="${sortBy == 'title'}">Title: A-Z</option>
                        </select>
                    </div>
                </div>
            </form>

            <div class="course-grid" th:unless="${#lists.isEmpty(courses)}">
                <div class="course-card" th:each="crs : ${courses}" style="display: flex; flex-direction: column; justify-content: space-between;">
                    <div>
                        <!-- Thumbnail -->
                        <div style="height: 140px; border-radius: 8px; overflow: hidden; background: #f0f0f0; display: flex; align-items: center; justify-content: center; margin-bottom: 1rem; position:relative;">
                            <img th:if="${crs.thumbnailUrl != null && !crs.thumbnailUrl.isEmpty()}" th:src="${crs.thumbnailUrl}" style="width: 100%; height: 100%; object-fit: cover;" />
                            <span th:unless="${crs.thumbnailUrl != null && !crs.thumbnailUrl.isEmpty()}" style="font-size: 2.5rem;">📚</span>
                        </div>
                        <h3 th:text="${crs.title}">Java Programming Masterclass</h3>
                        <p><strong>Instructor:</strong> <span th:text="${crs.instructorName}">Tran Van B</span></p>
                        <p><strong>Category:</strong> <span th:text="${crs.categoryName}">Programming</span></p>
                        <p><strong>Price:</strong> <span th:text="${crs.price == null || crs.price.signum() == 0 ? 'Free' : '$' + crs.price}">799,000 VND</span></p>
                        <p style="color: #666; font-size: 0.9rem;" th:text="${crs.description}">Learn Java from scratch to advanced level...</p>
                    </div>
                    <div style="margin-top: 1rem;">
                        <a th:href="@{/student/courses/detail(id=${crs.id})}" class="btn btn-primary" style="display: block; text-align: center; text-decoration: none;">View Detail →</a>
                    </div>
                </div>
            </div>

            <!-- Empty state -->
            <div th:if="${#lists.isEmpty(courses)}" style="text-align: center; padding: 4rem 2rem; background: white; border-radius: 8px; border: 1px solid #eee; margin-top:2rem;">
                <div style="font-size: 3rem; margin-bottom: 1rem;">🔍</div>
                <h3>No Courses Found</h3>
                <p style="color: #666; margin-top: 0.5rem;">We couldn't find any courses matching your search. Try resetting filters.</p>
                <a th:href="@{/student/courses}" class="btn btn-secondary" style="margin-top: 1.5rem; display: inline-block; text-decoration: none;">Reset Filters</a>
            </div>

        </main>
    </div>
    <footer th:replace="~{fragments/layout :: footer}"></footer>
    <script th:src="@{/js/student/student.js}"></script>
</body>
</html>
