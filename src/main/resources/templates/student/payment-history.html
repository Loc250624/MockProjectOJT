<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment History - Student - OJTSU26 E-Learning</title>
    <link rel="stylesheet" th:href="@{/css/student/student.css}">
</head>
<body>
    <header th:replace="~{fragments/layout :: header('student')}"></header>
    <div class="layout-container">
        <aside th:replace="~{fragments/layout :: sidebar-student}"></aside>
        <main class="main-content">
            <h1>Payment History</h1>
            <table class="table">
                <thead>
                    <tr>
                        <th>Order Code</th>
                        <th>Course</th>
                        <th>Amount</th>
                        <th>Method</th>
                        <th>Status</th>
                        <th>Date</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="ord : ${orders}">
                        <td th:text="${ord.orderCode}">ORD123456</td>
                        <td th:text="${!#lists.isEmpty(ord.items) ? ord.items[0].courseName : 'N/A'}">Java Basics</td>
                        <td th:text="${ord.totalAmount != null ? '$' + #numbers.formatDecimal(ord.totalAmount, 1, 'COMMA', 2, 'POINT') : 'Free'}">$199.00</td>
                        <td th:text="${ord.paymentMethod}">MoMo</td>
                        <td th:text="${ord.status}">PENDING</td>
                        <td th:text="${#temporals.format(ord.createdAt, 'yyyy-MM-dd HH:mm')}">2026-06-25 15:30</td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(orders)}">
                        <td colspan="6" style="text-align: center; color: var(--lumina-gray-500);">No payment history found.</td>
                    </tr>
                </tbody>
            </table>
        </main>
    </div>
    <footer th:replace="~{fragments/layout :: footer}"></footer>
    <script th:src="@{/js/student/student.js}"></script>
</body>
</html>
