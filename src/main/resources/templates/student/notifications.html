<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifications — Student Portal | LumiNa</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@1,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/lumina-design-system.css}">
    <link rel="stylesheet" th:href="@{/css/student/student.css}">
</head>
<body>

<div class="lumina-portal">
    <aside th:replace="~{fragments/layout :: sidebar-student}"></aside>

    <div class="lumina-portal-content" style="display:flex;flex-direction:column;min-height:100vh;">
        <div th:replace="~{fragments/layout :: topbar-student('Notifications')}"></div>
        
        <main class="lumina-portal-main">
            <div class="page-header" style="display:flex;align-items:flex-end;justify-content:space-between;gap:1rem;flex-wrap:wrap;">
                <div>
                    <h1 class="page-title">Notifications</h1>
                    <p class="page-subtitle">Stay updated on your academic progress and system announcements.</p>
                </div>
                <div class="notification-center-actions">
                    <button class="btn btn-secondary btn-sm" type="button" data-notification-center-mark-all>
                        <svg th:replace="~{fragments/icons :: icon('approve')}"></svg>
                        <span>Mark all as read</span>
                    </button>
                </div>
            </div>

            <div data-notification-center data-page-size="10">
                <div class="notification-center-list" data-notification-center-list>
                    <div class="notification-state">Loading notifications...</div>
                </div>
                <button class="btn btn-secondary btn-sm" type="button" data-notification-load-more hidden>
                    <svg th:replace="~{fragments/icons :: icon('next')}"></svg>
                    <span>Load more</span>
                </button>
            </div>

        </main>
        
        <footer th:replace="~{fragments/layout :: portal-footer}"></footer>
    </div>
</div>

<script th:src="@{/js/student/student.js}"></script>
</body>
</html>
