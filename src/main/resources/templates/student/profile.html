<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Profile | LumiNa</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@1,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/lumina-design-system.css}">
    <link rel="stylesheet" th:href="@{/css/student/student.css}">
    <link rel="stylesheet" th:href="@{/css/common/profile.css}">
</head>
<body>
<div class="lumina-portal">
    <aside th:replace="~{fragments/layout :: sidebar-student}"></aside>

    <div class="lumina-portal-content" style="display:flex;flex-direction:column;min-height:100vh;">
        <div th:replace="~{fragments/layout :: topbar-student('Profile')}"></div>

        <main class="lumina-portal-main">
            <div id="profile-page"
                 class="profile-page"
                 th:data-profile-endpoint="@{/student/profile}"
                 th:data-auth-provider="${profile.authProvider}"
                 th:data-current-avatar-url="${profile.avatarUrl}"
                 th:data-placeholder-src="@{/images/avatar-placeholder.png}">
                <div class="grid-main-aside">
                    <div>
                        <div th:replace="~{fragments/profile :: header('Student')}"></div>

                        <div class="stats-grid-4">
                            <div class="stat-card">
                                <div class="stat-label">Learning Courses</div>
                                <div class="stat-value">0</div>
                            </div>
                            <div class="stat-card">
                                <div class="stat-label">Completed Lessons</div>
                                <div class="stat-value">0</div>
                            </div>
                            <div class="stat-card">
                                <div class="stat-label">Certificates</div>
                                <div class="stat-value text-success">0</div>
                            </div>
                            <div class="stat-card">
                                <div class="stat-label">Pending Payments</div>
                                <div class="stat-value">0</div>
                            </div>
                        </div>

                        <div th:replace="~{fragments/profile :: account-information('Student Account Information')}"></div>
                    </div>

                    <div>
                        <div class="card card-padded profile-card">
                            <h2 class="section-title">Student Quick Actions</h2>
                            <div class="profile-actions-list">
                                <a class="profile-action-link" th:href="@{/student/courses}">Browse Courses <span>-></span></a>
                                <a class="profile-action-link" th:href="@{/student/my-courses}">My Courses <span>-></span></a>
                                <a class="profile-action-link" th:href="@{/student/certificates}">Certificates <span>-></span></a>
                                <a class="profile-action-link" th:href="@{/student/payment-history}">Payment History <span>-></span></a>
                            </div>
                        </div>
                    </div>
                </div>

                <div th:replace="~{fragments/profile :: edit-modal}"></div>
            </div>
        </main>

        <footer th:replace="~{fragments/layout :: portal-footer}"></footer>
    </div>
</div>

<script th:src="@{/js/student/student.js}"></script>
<script th:src="@{/js/common/profile.js}"></script>
</body>
</html>
