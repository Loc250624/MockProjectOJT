<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Courses - Student - OJTSU26 E-Learning</title>
    <link rel="stylesheet" th:href="@{/css/student/student.css}">
</head>
<body>
    <header th:replace="~{fragments/layout :: header('student')}"></header>
    <div class="layout-container">
        <aside th:replace="~{fragments/layout :: sidebar-student}"></aside>
        <main class="main-content">
            <h1>My Courses</h1>

            <div class="course-grid" th:unless="${#lists.isEmpty(courseCards)}">
                <div class="course-card" th:each="course : ${courseCards}">
                    <div class="student-course-thumb">
                        <img th:if="${course.thumbnailUrl != null && !course.thumbnailUrl.isEmpty()}" th:src="${course.thumbnailUrl}" alt="">
                        <span th:unless="${course.thumbnailUrl != null && !course.thumbnailUrl.isEmpty()}">Course</span>
                    </div>
                    <h3 th:text="${course.courseTitle}">Course Title</h3>
                    <p><strong>Instructor:</strong> <span th:text="${course.instructorName ?: 'Unknown instructor'}">Instructor</span></p>
                    <p class="student-course-meta">Enrolled on: <span th:text="${course.enrolledAt == null ? 'Unknown' : #temporals.format(course.enrolledAt, 'dd/MM/yyyy')}">Unknown</span></p>
                    <div class="student-progress-line">
                        <span th:text="${course.completedLessons} + ' of ' + ${course.totalLessons} + ' lessons'">0 of 0 lessons</span>
                        <strong th:text="${course.progressPercentage} + '%'">0%</strong>
                    </div>
                    <div class="progress-bar" th:aria-label="${'Course progress ' + course.progressPercentage + ' percent'}">
                        <div class="progress-bar-fill" th:style="'width:' + ${course.progressPercentage} + '%;'"></div>
                    </div>
                    <a th:href="@{/student/learning(courseId=${course.courseId},lessonId=${course.resumeLessonId})}" class="btn btn-primary student-course-action">Continue Learning</a>
                </div>
            </div>

            <div th:if="${#lists.isEmpty(courseCards)}" class="student-empty-state">
                <h3>No Courses Yet</h3>
                <p>You haven't enrolled in any courses yet.</p>
                <a th:href="@{/student/courses}" class="btn btn-primary">Browse Catalog</a>
            </div>

        </main>
    </div>
    <footer th:replace="~{fragments/layout :: footer}"></footer>
    <script th:src="@{/js/student/student.js}"></script>
</body>
</html>
