<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Courses - Student - OJTSU26 E-Learning</title>
    <link rel="stylesheet" th:href="@{/css/student/student.css}">
</head>
<body>
    <header th:replace="~{fragments/layout :: header('student')}"></header>
    <div class="layout-container">
        <aside th:replace="~{fragments/layout :: sidebar-student}"></aside>
        <main class="main-content">
            <h1>My Courses</h1>

            <div class="course-grid" th:unless="${#lists.isEmpty(enrollments)}">
                <div class="course-card" th:each="enrollment : ${enrollments}">
                    <div style="height: 140px; border-radius: 8px; overflow: hidden; background: #f0f0f0; display: flex; align-items: center; justify-content: center; margin-bottom: 1rem;">
                        <img th:if="${enrollment.course.thumbnailUrl != null && !enrollment.course.thumbnailUrl.isEmpty()}" th:src="${enrollment.course.thumbnailUrl}" style="width: 100%; height: 100%; object-fit: cover;" />
                        <span th:unless="${enrollment.course.thumbnailUrl != null && !enrollment.course.thumbnailUrl.isEmpty()}" style="font-size: 2.5rem;">📚</span>
                    </div>
                    <h3 th:text="${enrollment.course.title}">Course Title</h3>
                    <p><strong>Instructor:</strong> <span th:text="${enrollment.course.instructorName}">Instructor</span></p>
                    <p style="margin-bottom: 0.3rem; font-size: 0.9rem; color: #666;">Enrolled on: <span th:text="${#temporals.format(enrollment.enrolledAt, 'dd/MM/yyyy')}"></span></p>
                    <div class="progress-bar">
                        <div class="progress-bar-fill" style="width: 0%;"></div>
                    </div>
                    <a th:href="@{/student/courses/detail(id=${enrollment.course.id})}" class="btn btn-primary" style="margin-top: 1rem; display: inline-block;">Continue Learning</a>
                </div>
            </div>
            
            <div th:if="${#lists.isEmpty(enrollments)}" style="text-align: center; padding: 4rem 2rem; background: white; border-radius: 8px; border: 1px solid #eee; margin-top:2rem;">
                <div style="font-size: 3rem; margin-bottom: 1rem;">🎓</div>
                <h3>No Courses Yet</h3>
                <p style="color: #666; margin-top: 0.5rem;">You haven't enrolled in any courses yet.</p>
                <a th:href="@{/student/courses}" class="btn btn-primary" style="margin-top: 1.5rem; display: inline-block; text-decoration: none;">Browse Catalog</a>
            </div>

        </main>
    </div>
    <footer th:replace="~{fragments/layout :: footer}"></footer>
    <script th:src="@{/js/student/student.js}"></script>
</body>
</html>
