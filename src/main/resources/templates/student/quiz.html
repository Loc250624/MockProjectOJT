<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${quiz != null ? quiz.title + ' - Quiz' : 'Quiz'}">Quiz</title>
    <link rel="stylesheet" th:href="@{/css/lumina-design-system.css}">
    <link rel="stylesheet" th:href="@{/css/student/student.css}">
</head>
<body class="lumina-bg assessment-page"
      th:attr="data-quiz-id=${quiz != null ? quiz.id : ''},data-course-id=${quiz != null ? quiz.courseId : ''}">
<header class="portal-topbar assessment-topbar">
    <div class="breadcrumb">
        <a th:href="@{/student/dashboard}">Dashboard</a>
        <span class="sep">&gt;</span>
        <a th:href="@{/student/learning(courseId=${quiz.courseId})}" th:if="${quiz != null}" th:text="${quiz.courseTitle}">Course</a>
        <span class="sep">&gt;</span>
        <span class="current" th:text="${quiz != null ? quiz.title : 'Quiz'}">Quiz</span>
    </div>
    <div class="assessment-status">
        <span id="quiz-save-state">Ready</span>
        <strong th:text="${quiz != null && quiz.durationMinutes != null ? quiz.durationMinutes + ' min' : 'No timer'}">30 min</strong>
    </div>
</header>

<main class="assessment-shell" th:if="${quiz != null}">
    <aside class="quiz-nav">
        <h3>Questions</h3>
        <p>Answered questions are highlighted.</p>
        <div class="quiz-nav-grid" id="quiz-nav-grid">
            <button th:each="question,iter : ${quiz.questions}"
                    type="button"
                    class="q-nav-btn"
                    th:text="${iter.index + 1}"
                    th:attr="data-question-index=${iter.index}">1</button>
        </div>
        <button class="btn btn-secondary assessment-wide" type="button" id="save-quiz-btn">
            <svg th:replace="~{fragments/icons :: icon('save')}"></svg>
            <span>Save draft</span>
        </button>
        <button class="btn btn-primary assessment-wide" type="button" id="submit-quiz-btn">
            <svg th:replace="~{fragments/icons :: icon('approve')}"></svg>
            <span>Submit quiz</span>
        </button>
        <div class="assessment-message" id="quiz-message"></div>
    </aside>

    <section class="quiz-area">
        <div class="quiz-question"
             th:each="question,iter : ${quiz.questions}"
             th:classappend="${iter.index == 0} ? ' active' : ''"
             th:attr="data-question-id=${question.id},data-question-type=${question.questionType}">
            <div class="quiz-question-header">
                <span class="badge badge-primary" th:text="'Question ' + ${iter.index + 1}">Question 1</span>
                <span class="badge badge-dark" th:text="${question.points} + ' pts'">1 pts</span>
            </div>
            <div class="quiz-question-text" th:text="${question.content}">Question text</div>
            <div class="quiz-options">
                <label class="quiz-option" th:each="option : ${question.options}">
                    <input th:type="${question.questionType.name() == 'MULTIPLE_CHOICE' ? 'checkbox' : 'radio'}"
                           th:name="'question-' + ${question.id}"
                           th:value="${option.id}"
                           th:checked="${question.selectedOptionIds != null and question.selectedOptionIds.contains(option.id)}">
                    <span th:text="${option.content}">Option</span>
                </label>
            </div>
        </div>
        <div class="quiz-footer">
            <button type="button" class="btn btn-secondary" id="previous-question-btn">
                <svg th:replace="~{fragments/icons :: icon('previous')}"></svg>
                <span>Previous</span>
            </button>
            <button type="button" class="btn btn-primary" id="next-question-btn">
                <span>Next</span>
                <svg th:replace="~{fragments/icons :: icon('next')}"></svg>
            </button>
        </div>
    </section>
</main>

<main class="assessment-shell" th:unless="${quiz != null}">
    <section class="empty-state">
        <div class="empty-state-icon"><svg th:replace="~{fragments/icons :: icon('info')}"></svg></div>
        <div class="empty-title">Quiz data is unavailable.</div>
    </section>
</main>

<script th:src="@{/js/student/student.js}"></script>
</body>
</html>
