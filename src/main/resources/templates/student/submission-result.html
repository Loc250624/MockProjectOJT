<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submission Result</title>
    <link rel="stylesheet" th:href="@{/css/lumina-design-system.css}">
    <link rel="stylesheet" th:href="@{/css/student/student.css}">
</head>
<body>
<header th:replace="~{fragments/layout :: header('student')}"></header>
<main class="assessment-shell single">
    <section class="assessment-panel">
        <div class="assessment-heading">
            <div>
                <p class="eyebrow">Submission result</p>
                <h1 th:text="${submission.assignmentTitle}">Assignment</h1>
            </div>
            <strong class="score-pill" th:text="${submission.released == true && submission.score != null ? submission.score + '%' : submission.status}">Status</strong>
        </div>
        <p th:if="${submission.released == true}"
           th:text="${submission.feedback != null ? submission.feedback : 'No teacher feedback yet.'}">Feedback</p>
        <p th:unless="${submission.released == true}">Your submission is still awaiting final published feedback.</p>
        <p class="eyebrow"
           th:if="${submission.released == true && submission.gradedAt != null}"
           th:text="${'Published ' + #temporals.format(submission.gradedAt, 'MMM d, yyyy HH:mm')}">Published</p>
        <div class="learning-code-result"
             th:if="${submission.judgeStatus != null || submission.outputLog != null || submission.totalTests != null}"
             th:classappend="${submission.judgeStatus != null && submission.judgeStatus.name() == 'PASSED' ? ' passed' : (submission.judgeStatus != null ? ' failed' : '')}">
            <strong th:text="${submission.judgeStatus != null ? submission.judgeStatus : 'Judge result'}">Judge result</strong>
            <span th:text="${submission.totalTests != null ? submission.passedTests + ' / ' + submission.totalTests + ' tests' : 'No test summary'}">Tests</span>
            <pre th:if="${submission.outputLog != null}" th:text="${submission.outputLog}">Judge log</pre>
        </div>
        <div class="student-mcq-list"
             th:if="${submission.answers != null && !#lists.isEmpty(submission.answers)}">
            <fieldset class="student-mcq-question" th:each="answer : ${submission.answers}">
                <legend th:text="${answer.content}">Question</legend>
                <div class="student-answer-option"
                     th:each="option : ${answer.options}"
                     th:classappend="${answer.selectedOptionIds != null && #lists.contains(answer.selectedOptionIds, option.id)} ? ' selected'">
                    <span th:text="${option.content}">Option</span>
                    <strong th:if="${answer.selectedOptionIds != null && #lists.contains(answer.selectedOptionIds, option.id)}">Selected</strong>
                </div>
            </fieldset>
        </div>
    </section>
</main>
<div th:replace="~{fragments/ai-chatbot :: widget}"></div>
</body>
</html>
