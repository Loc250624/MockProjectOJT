<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deadlines - Student Portal | LumiNa</title>
    <link rel="stylesheet" th:href="@{/css/lumina-design-system.css}">
    <link rel="stylesheet" th:href="@{/css/student/student.css}">
</head>
<body>
<div class="lumina-portal">
    <aside th:replace="~{fragments/layout :: sidebar-student}"></aside>

    <div class="lumina-portal-content" style="display:flex;flex-direction:column;min-height:100vh;">
        <div th:replace="~{fragments/layout :: topbar-student('Deadlines')}"></div>

        <main class="lumina-portal-main">
            <div class="page-header">
                <h1 class="page-title">Deadlines</h1>
                <p class="page-subtitle">Assignment due dates from your enrolled courses.</p>
            </div>

            <div class="card card-padded">
                <div class="student-empty-state" th:if="${#lists.isEmpty(deadlines)}">
                    <h3>No upcoming deadlines</h3>
                    <p>You have no upcoming assignment deadlines.</p>
                    <a th:href="@{/student/my-courses}" class="btn btn-primary">Back to My Courses</a>
                </div>

                <div style="display:flex;flex-direction:column;gap:1rem;" th:unless="${#lists.isEmpty(deadlines)}">
                    <a th:each="deadline : ${deadlines}"
                       th:href="${deadline.destinationUrl}"
                       class="deadline-card"
                       th:classappend="${deadline.cardClass}"
                       style="text-decoration:none;">
                        <div class="date-badge">
                            <span class="day" th:text="${deadline.day}">--</span>
                            <span class="month" th:text="${deadline.month}">---</span>
                        </div>
                        <div style="min-width:0;">
                            <div class="deadline-title" th:text="${deadline.title}">Assignment</div>
                            <div class="deadline-code" th:text="${deadline.courseTitle}">Course</div>
                            <span class="badge" th:classappend="${deadline.statusClass}" th:text="${deadline.statusLabel}">Upcoming</span>
                        </div>
                    </a>
                </div>
            </div>
        </main>

        <footer th:replace="~{fragments/layout :: portal-footer}"></footer>
    </div>
</div>
<script th:src="@{/js/student/student.js}"></script>
</body>
</html>
