<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<th:block th:fragment="themeSwitch">
    <button class="theme-switch"
            type="button"
            role="switch"
            aria-checked="false"
            aria-label="Switch to dark mode"
            data-theme-switch>
        <span class="theme-switch__track" aria-hidden="true">
            <span class="theme-switch__icon theme-switch__icon--sun">
                <svg viewBox="0 0 24 24" focusable="false" aria-hidden="true">
                    <circle cx="12" cy="12" r="3.5"></circle>
                    <path d="M12 2v2.1M12 19.9V22M4.93 4.93l1.49 1.49M17.58 17.58l1.49 1.49M2 12h2.1M19.9 12H22M4.93 19.07l1.49-1.49M17.58 6.42l1.49-1.49"></path>
                </svg>
            </span>
            <span class="theme-switch__icon theme-switch__icon--moon">
                <svg viewBox="0 0 24 24" focusable="false" aria-hidden="true">
                    <path d="M20.3 15.2A8.5 8.5 0 0 1 8.8 3.7 8.6 8.6 0 1 0 20.3 15.2Z"></path>
                </svg>
            </span>
            <span class="theme-switch__thumb"></span>
        </span>
    </button>
</th:block>
</body>
</html>
