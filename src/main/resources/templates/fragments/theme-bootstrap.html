<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<th:block th:fragment="bootstrap">
    <!-- CSRF Meta Tags for AJAX/Fetch Requests -->
    <meta th:if="${_csrf != null}" name="_csrf" th:content="${_csrf.token}">
    <meta th:if="${_csrf != null}" name="_csrf_header" th:content="${_csrf.headerName}">
    <meta th:if="${_csrf != null}" name="_csrf_parameter" th:content="${_csrf.parameterName}">

    <script>
        (function () {
            var storageKey = 'lumina-theme';
            var theme = null;

            try {
                theme = window.localStorage.getItem(storageKey);
            } catch (error) {
                theme = null;
            }

            if (theme !== 'light' && theme !== 'dark') {
                try {
                    theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
                        ? 'dark'
                        : 'light';
                } catch (error) {
                    theme = 'light';
                }
            }

            document.documentElement.setAttribute('data-theme', theme);
            document.documentElement.style.colorScheme = theme;
        }());
    </script>
    <!-- CSRF Protection Interceptor for Fetch -->
    <script th:src="@{/js/csrf-fetch.js}"></script>
</th:block>
</body>
</html>
