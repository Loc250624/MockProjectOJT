<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<svg th:fragment="icon(name)"
     xmlns="http://www.w3.org/2000/svg"
     class="lumina-icon"
     viewBox="0 0 24 24"
     fill="none"
     stroke="currentColor"
     stroke-width="2"
     stroke-linecap="round"
     stroke-linejoin="round"
     aria-hidden="true"
     focusable="false"
     th:attr="data-icon=${name}">
    <g th:switch="${name}">
        <g th:case="'search'">
            <circle cx="11" cy="11" r="7"></circle>
            <path d="m20 20-3.8-3.8"></path>
        </g>
        <g th:case="'filter'">
            <path d="M4 5h16"></path>
            <path d="M7 12h10"></path>
            <path d="M10 19h4"></path>
        </g>
        <g th:case="'help'">
            <circle cx="12" cy="12" r="9"></circle>
            <path d="M9.5 9a2.7 2.7 0 0 1 5 1.4c0 1.8-2.5 2.1-2.5 4"></path>
            <path d="M12 18h.01"></path>
        </g>
        <g th:case="'info'">
            <circle cx="12" cy="12" r="9"></circle>
            <path d="M12 11v5"></path>
            <path d="M12 8h.01"></path>
        </g>
        <g th:case="'more'">
            <circle cx="5" cy="12" r="1"></circle>
            <circle cx="12" cy="12" r="1"></circle>
            <circle cx="19" cy="12" r="1"></circle>
        </g>
        <g th:case="'previous'">
            <path d="m15 18-6-6 6-6"></path>
        </g>
        <g th:case="'next'">
            <path d="m9 18 6-6-6-6"></path>
        </g>
        <g th:case="'edit'">
            <path d="M12 20h9"></path>
            <path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"></path>
        </g>
        <g th:case="'view'">
            <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"></path>
            <circle cx="12" cy="12" r="3"></circle>
        </g>
        <g th:case="'hide'">
            <path d="M3 3l18 18"></path>
            <path d="M10.6 10.6A2 2 0 0 0 13.4 13.4"></path>
            <path d="M9.9 4.3A10.9 10.9 0 0 1 12 4c6.5 0 10 8 10 8a17.5 17.5 0 0 1-3 4.3"></path>
            <path d="M6.6 6.6C3.7 8.5 2 12 2 12s3.5 8 10 8a10.8 10.8 0 0 0 4.2-.9"></path>
        </g>
        <g th:case="'approve'">
            <circle cx="12" cy="12" r="9"></circle>
            <path d="m8 12 2.5 2.5L16 9"></path>
        </g>
        <g th:case="'reject'">
            <circle cx="12" cy="12" r="9"></circle>
            <path d="m9 9 6 6"></path>
            <path d="m15 9-6 6"></path>
        </g>
        <g th:case="'delete'">
            <path d="M3 6h18"></path>
            <path d="M8 6V4h8v2"></path>
            <path d="M19 6l-1 14H6L5 6"></path>
            <path d="M10 11v5"></path>
            <path d="M14 11v5"></path>
        </g>
        <g th:case="'save'">
            <path d="M5 3h12l2 2v16H5Z"></path>
            <path d="M8 3v6h8V3"></path>
            <path d="M8 21v-7h8v7"></path>
        </g>
        <g th:case="'create'">
            <path d="M12 5v14"></path>
            <path d="M5 12h14"></path>
        </g>
        <g th:case="'upload'">
            <path d="M12 16V4"></path>
            <path d="m7 9 5-5 5 5"></path>
            <path d="M5 20h14"></path>
        </g>
        <g th:case="'download'">
            <path d="M12 4v12"></path>
            <path d="m7 11 5 5 5-5"></path>
            <path d="M5 20h14"></path>
        </g>
        <g th:case="'settings'">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.8 1.8 0 0 0 .4 2l.1.1-2 3.5-.2-.1a1.8 1.8 0 0 0-2.1.2l-.2.1a1.8 1.8 0 0 0-.9 1.7V23h-5v-.5a1.8 1.8 0 0 0-.9-1.7l-.2-.1a1.8 1.8 0 0 0-2.1-.2l-.2.1-2-3.5.1-.1a1.8 1.8 0 0 0 .4-2V15a1.8 1.8 0 0 0-1.5-1.1H3v-4h.3a1.8 1.8 0 0 0 1.5-1.1V8.7a1.8 1.8 0 0 0-.4-2l-.1-.1 2-3.5.2.1a1.8 1.8 0 0 0 2.1-.2l.2-.1A1.8 1.8 0 0 0 9.7 1h4.6a1.8 1.8 0 0 0 .9 1.9l.2.1a1.8 1.8 0 0 0 2.1.2l.2-.1 2 3.5-.1.1a1.8 1.8 0 0 0-.4 2v.1A1.8 1.8 0 0 0 20.7 10h.3v4h-.3A1.8 1.8 0 0 0 19.4 15Z"></path>
        </g>
        <g th:case="'sign-out'">
            <path d="M10 17l5-5-5-5"></path>
            <path d="M15 12H3"></path>
            <path d="M13 4h6v16h-6"></path>
        </g>
        <g th:case="'dashboard'">
            <rect x="3" y="3" width="7" height="8" rx="1"></rect>
            <rect x="14" y="3" width="7" height="5" rx="1"></rect>
            <rect x="14" y="12" width="7" height="9" rx="1"></rect>
            <rect x="3" y="15" width="7" height="6" rx="1"></rect>
        </g>
        <g th:case="'courses'">
            <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
            <path d="M4 4.5A2.5 2.5 0 0 1 6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5Z"></path>
        </g>
        <g th:case="'users'">
            <path d="M16 21v-2a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v2"></path>
            <circle cx="9.5" cy="7" r="4"></circle>
            <path d="M22 21v-2a4 4 0 0 0-3-3.9"></path>
            <path d="M16 3.2a4 4 0 0 1 0 7.6"></path>
        </g>
        <g th:case="'lessons'">
            <path d="M8 6h13"></path>
            <path d="M8 12h13"></path>
            <path d="M8 18h13"></path>
            <path d="M3 6h.01"></path>
            <path d="M3 12h.01"></path>
            <path d="M3 18h.01"></path>
        </g>
        <g th:case="'videos'">
            <path d="M15 10l5-3v10l-5-3Z"></path>
            <rect x="3" y="6" width="12" height="12" rx="2"></rect>
        </g>
        <g th:case="'students'">
            <path d="M22 10 12 5 2 10l10 5 10-5Z"></path>
            <path d="M6 12v5c3.5 2 8.5 2 12 0v-5"></path>
        </g>
        <g th:case="'progress'">
            <path d="M3 3v18h18"></path>
            <path d="m7 15 4-4 3 3 5-7"></path>
        </g>
        <g th:case="'blog'">
            <path d="M4 4h16v16H4Z"></path>
            <path d="M8 8h8"></path>
            <path d="M8 12h8"></path>
            <path d="M8 16h5"></path>
        </g>
        <g th:case="'analytics'">
            <path d="M4 19V5"></path>
            <path d="M4 19h16"></path>
            <rect x="7" y="11" width="3" height="5"></rect>
            <rect x="12" y="7" width="3" height="9"></rect>
            <rect x="17" y="4" width="3" height="12"></rect>
        </g>
        <g th:case="'payments'">
            <rect x="3" y="5" width="18" height="14" rx="2"></rect>
            <path d="M3 10h18"></path>
            <path d="M7 15h4"></path>
        </g>
        <g th:case="'transactions'">
            <path d="M8 6h13"></path>
            <path d="M8 12h13"></path>
            <path d="M8 18h13"></path>
            <path d="m3 6 1 1 2-2"></path>
            <path d="m3 12 1 1 2-2"></path>
            <path d="m3 18 1 1 2-2"></path>
        </g>
        <g th:case="'categories'">
            <path d="M20.6 13.4 13.4 20.6a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8Z"></path>
            <circle cx="7.5" cy="7.5" r=".5"></circle>
        </g>
        <g th:case="'bell'">
            <path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"></path>
            <path d="M13.7 21a2 2 0 0 1-3.4 0"></path>
        </g>
        <g th:case="'profile'">
            <circle cx="12" cy="8" r="4"></circle>
            <path d="M20 21a8 8 0 0 0-16 0"></path>
        </g>
        <g th:case="'calendar'">
            <rect x="3" y="4" width="18" height="18" rx="2"></rect>
            <path d="M16 2v4"></path>
            <path d="M8 2v4"></path>
            <path d="M3 10h18"></path>
        </g>
        <g th:case="'clock'">
            <circle cx="12" cy="12" r="9"></circle>
            <path d="M12 7v5l3 2"></path>
        </g>
        <g th:case="'archive'">
            <rect x="3" y="4" width="18" height="4" rx="1"></rect>
            <path d="M5 8v12h14V8"></path>
            <path d="M10 12h4"></path>
        </g>
        <g th:case="'restore'">
            <path d="M3 12a9 9 0 1 0 3-6.7"></path>
            <path d="M3 4v6h6"></path>
            <path d="M12 7v5l3 2"></path>
        </g>
        <g th:case="'comments'">
            <path d="M21 15a4 4 0 0 1-4 4H8l-5 3V7a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4Z"></path>
        </g>
        <g th:case="'code'">
            <path d="m8 9-4 3 4 3"></path>
            <path d="m16 9 4 3-4 3"></path>
            <path d="m14 5-4 14"></path>
        </g>
        <g th:case="*">
            <circle cx="12" cy="12" r="9"></circle>
            <path d="M12 8v4"></path>
            <path d="M12 16h.01"></path>
        </g>
    </g>
</svg>

<span th:fragment="icon-box(name, label)" class="lumina-icon-box">
    <svg th:replace="~{fragments/icons :: icon(${name})}"></svg>
    <span class="sr-only" th:if="${label != null}" th:text="${label}">Icon</span>
</span>

</html>
