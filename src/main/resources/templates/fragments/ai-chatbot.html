<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<div th:fragment="widget"
     class="ai-chatbot"
     data-ai-chatbot-root
     th:data-chat-scope="${#authentication?.name ?: 'anonymous'}"
     th:data-chat-authenticated="${#authentication != null and #authentication.authenticated and #authentication.name != 'anonymousUser'}">
    <link rel="stylesheet" th:href="@{/css/ai-chatbot.css}">

    <button type="button"
            class="ai-chatbot-toggle"
            data-ai-chatbot-toggle
            aria-label="Open AI Chatbot"
            aria-controls="ai-chatbot-panel"
            aria-expanded="false">
        <span class="ai-chatbot-toggle-icon" aria-hidden="true">
            <img th:src="@{/images/hubot.svg}" class="ai-chatbot-logo-image" alt="">
        </span>
        <span class="ai-chatbot-launcher-status" data-ai-chatbot-launcher-status aria-hidden="true"></span>
        <span class="sr-only">Open AI Chatbot</span>
    </button>

    <section class="ai-chatbot-panel"
             id="ai-chatbot-panel"
             data-ai-chatbot-panel
             role="dialog"
             aria-labelledby="ai-chatbot-title"
             hidden>
        <header class="ai-chatbot-header">
            <span class="ai-chatbot-avatar" aria-hidden="true">
                <img th:src="@{/images/hubot.svg}" class="ai-chatbot-logo-image" alt="">
            </span>
            <span class="ai-chatbot-header-copy">
                <strong id="ai-chatbot-title">AI Chatbot</strong>
                <span class="ai-chatbot-header-status"
                      data-ai-chatbot-header-status
                      aria-live="polite">Online · Ready to help</span>
            </span>
            <button type="button"
                    class="ai-chatbot-close"
                    data-ai-chatbot-close
                    aria-label="Close AI Chatbot">
                <span aria-hidden="true">&times;</span>
            </button>
        </header>

        <div class="ai-chatbot-content" data-ai-chatbot-content>
            <div class="ai-chatbot-context-badge"
                 data-ai-chatbot-context-badge
                 hidden></div>
            <div class="ai-chatbot-messages"
                 data-ai-chatbot-messages
                 role="log"
                 aria-live="polite"
                 aria-relevant="additions">
                <div class="ai-chatbot-message assistant" data-ai-chatbot-greeting>
                    <span class="ai-chatbot-message-avatar" aria-hidden="true">
                        <svg viewBox="0 0 24 24" focusable="false">
                            <path d="M12 3l1.2 3.8L17 8l-3.8 1.2L12 13l-1.2-3.8L7 8l3.8-1.2L12 3z"></path>
                            <path d="M19 14l.7 2.3L22 17l-2.3.7L19 20l-.7-2.3L16 17l2.3-.7L19 14z"></path>
                            <path d="M5 14l.7 2.3L8 17l-2.3.7L5 20l-.7-2.3L2 17l2.3-.7L5 14z"></path>
                        </svg>
                    </span>
                    <div class="ai-chatbot-message-body">
                        <strong>AI Chatbot</strong>
                        <div class="ai-chatbot-bubble">Hello! I can help you navigate LumiNa, understand website features, and explain authorized lesson content. What would you like to know?</div>
                    </div>
                </div>
            </div>

            <div class="ai-chatbot-suggestion-groups">
                <button type="button"
                        class="ai-chatbot-suggestions-toggle"
                        data-ai-chatbot-suggestions-toggle
                        aria-expanded="false"
                        hidden>
                    <span aria-hidden="true">+</span>
                    <span>Suggestions</span>
                </button>
                <div class="ai-chatbot-quick-actions"
                     data-ai-chatbot-quick-actions
                     aria-label="Quick Actions"></div>
                <div class="ai-chatbot-related-actions"
                     data-ai-chatbot-related-actions
                     aria-label="Related questions"
                     hidden>
                    <span>Follow-up suggestions</span>
                    <div class="ai-chatbot-quick-actions" data-ai-chatbot-related-buttons></div>
                </div>
            </div>
        </div>

        <p class="ai-chatbot-status" data-ai-chatbot-status aria-live="polite"></p>
        <form class="ai-chatbot-form" data-ai-chatbot-form>
            <label class="sr-only" for="ai-chatbot-input">Message AI Chatbot</label>
            <textarea id="ai-chatbot-input"
                      data-ai-chatbot-input
                      rows="2"
                      maxlength="1200"
                      placeholder="Ask about this website"></textarea>
            <button type="submit" data-ai-chatbot-send aria-label="Send message">
                <span aria-hidden="true">&#10140;</span>
            </button>
        </form>
    </section>

    <span hidden
          data-csrf-token
          th:data-csrf-token="${_csrf?.token}"
          th:data-csrf-header="${_csrf?.headerName}"
          th:data-csrf-parameter="${_csrf?.parameterName}"></span>
    <script th:src="@{/js/csrf-fetch.js}" defer></script>
    <script th:src="@{/js/ai-chatbot.js}" defer></script>
</div>

</html>
