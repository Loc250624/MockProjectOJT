<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Settings - Admin Portal | LumiNa</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@1,700&display=swap" rel="stylesheet">
    <th:block th:replace="~{fragments/theme-bootstrap :: bootstrap}"></th:block>
    <link rel="stylesheet" th:href="@{/css/lumina-design-system.css}">
    <link rel="stylesheet" th:href="@{/css/admin/admin.css}">
    <link rel="stylesheet" th:href="@{/css/components/lumina-action-dialog.css}">
</head>
<body>
<div class="lumina-portal admin-settings-page">
    <aside th:replace="~{fragments/layout :: sidebar-admin}"></aside>

    <div class="lumina-portal-content" style="display:flex;flex-direction:column;min-height:100vh;">
        <div th:replace="~{fragments/layout :: topbar-admin('System Settings')}"></div>

        <main class="lumina-portal-main" style="flex:1;">
            <section class="content-section">
                <div class="page-header admin-settings-header">
                    <div>
                        <h1 class="page-title">System Settings</h1>
                        <p class="page-subtitle">Manage platform-wide preferences and operational controls.</p>
                    </div>
                </div>

                <div class="admin-settings-message" id="settings-message" role="status" hidden></div>
                <div class="admin-inline-loader" id="settings-loading">Loading settings...</div>
                <div class="empty-state" id="settings-empty" hidden>No settings are available.</div>
                <div class="error-state" id="settings-error" hidden></div>

                <form class="admin-settings-form" id="admin-settings-form" hidden>
                    <nav class="admin-settings-tabs" id="settings-tabs" aria-label="Settings sections">
                        <button type="button" class="admin-settings-tab is-active" data-settings-tab="general">General</button>
                        <button type="button" class="admin-settings-tab" data-settings-tab="learning">Learning</button>
                        <button type="button" class="admin-settings-tab" data-settings-tab="payments">Payments</button>
                        <button type="button" class="admin-settings-tab" data-settings-tab="maintenance">Maintenance</button>
                        <button type="button" class="admin-settings-tab" data-settings-tab="advanced">Advanced</button>
                    </nav>

                    <div id="settings-groups" class="admin-settings-groups"></div>

                    <div class="admin-settings-save-bar" id="settings-save-bar" hidden>
                        <span id="settings-dirty-count">Unsaved changes</span>
                        <div class="admin-settings-save-actions">
                            <button type="button" class="btn btn-secondary" id="settings-discard">Discard</button>
                            <button type="button" class="btn btn-primary" id="settings-save-all">Save changes</button>
                        </div>
                    </div>
                </form>
            </section>
        </main>

    </div>
</div>
<div th:replace="~{fragments/lumina-action-dialog :: luminaActionDialog}"></div>
<script th:src="@{/js/admin/admin.js}"></script>
<script th:src="@{/js/components/lumina-action-dialog.js}"></script>
<script th:src="@{/js/admin/settings.js}"></script>
</body>
</html>
