<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Form - Admin - OJTSU26 E-Learning</title>
    <link rel="stylesheet" th:href="@{/css/admin/admin.css}">
</head>
<body>
    <header th:replace="~{fragments/layout :: header('admin')}"></header>
    <div class="layout-container">
        <aside th:replace="~{fragments/layout :: sidebar-admin}"></aside>
        <main class="main-content">
            <h1>User Form</h1>
            <form class="form-container"><div class="form-group"><label>Name</label><input type="text"></div><div class="form-group"><label>Email</label><input type="email"></div><div class="form-group"><label>Role</label><select><option>Admin</option><option>Teacher</option><option>Student</option></select></div><button class="btn btn-primary">Submit</button></form>
        </main>
    </div>
    <footer th:replace="~{fragments/layout :: footer}"></footer>
    <script th:src="@{/js/admin/admin.js}"></script>
</body>
</html>
