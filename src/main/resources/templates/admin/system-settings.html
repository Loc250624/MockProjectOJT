<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Settings - Admin - OJTSU26 E-Learning</title>
    <th:block th:replace="~{fragments/theme-bootstrap :: bootstrap}"></th:block>
    <link rel="stylesheet" th:href="@{/css/lumina-design-system.css}">
    <link rel="stylesheet" th:href="@{/css/admin/admin.css}">
</head>
<body>
    <header th:replace="~{fragments/layout :: header('admin')}"></header>
    <div class="layout-container">
        <aside th:replace="~{fragments/layout :: sidebar-admin}"></aside>
        <main class="main-content">
            <h1>System Settings</h1>
            <form class="form-container"><div class="form-group"><label>Max Upload Size (MB)</label><input type="number" value="10"></div><div class="form-group"><label>Default Language</label><select><option>English</option><option>Vietnamese</option></select></div><button class="btn btn-primary">Save</button></form>
        </main>
    </div>
    <script th:src="@{/js/admin/admin.js}"></script>
</body>
</html>
