<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blogs - Admin Portal | LumiNa</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <th:block th:replace="~{fragments/theme-bootstrap :: bootstrap}"></th:block>
    <link rel="stylesheet" th:href="@{/css/lumina-design-system.css}">
    <link rel="stylesheet" th:href="@{/css/admin/admin.css}">
</head>
<body>
<div class="lumina-portal">
    <aside th:replace="~{fragments/layout :: sidebar-admin}"></aside>

    <div class="lumina-portal-content" style="display:flex;flex-direction:column;min-height:100vh;">
        <div th:replace="~{fragments/layout :: topbar-admin('Blogs')}"></div>

        <main class="lumina-portal-main" style="flex:1;">
            <div class="page-header" style="display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:1.5rem;">
                <div>
                    <h1 class="page-title">Blogs</h1>
                    <p class="page-subtitle">Review blog status and moderation outcomes.</p>
                </div>
                <div style="display:flex;gap:0.75rem;flex-wrap:wrap;">
                    <a th:href="@{/admin/comments}" class="btn btn-secondary">Manage Comments</a>
                    <a th:href="@{/admin/blogs/moderation}" class="btn btn-primary">Moderation Queue</a>
                </div>
            </div>

            <div th:if="${successMessage}" class="badge badge-success" style="margin-bottom:1rem;display:block;padding:0.65rem 1rem;border-radius:8px;font-size:0.875rem;font-weight:500;text-transform:none;" th:text="${successMessage}"></div>
            <div th:if="${errorMessage}" class="badge badge-danger" style="margin-bottom:1rem;display:block;padding:0.65rem 1rem;border-radius:8px;font-size:0.875rem;font-weight:500;text-transform:none;" th:text="${errorMessage}"></div>
            <div data-loading-message hidden style="margin-bottom:1rem;color:var(--lumina-gray-500);font-size:0.875rem;">Processing moderation action...</div>

            <div class="admin-table-container" style="overflow-x:auto;">
                <div class="admin-table-toolbar">
                    <span style="font-weight:600;font-size:0.875rem;color:var(--lumina-gray-800);">
                        All Blogs
                        <span th:text="'(' + ${#lists.size(blogs)} + ')'" style="color:var(--lumina-gray-500);font-weight:400;"></span>
                    </span>
                </div>

                <table class="lumina-table" style="width:100%;border-collapse:collapse;">
                    <thead>
                    <tr>
                        <th style="padding:0.75rem 1.25rem;text-align:left;font-size:0.75rem;font-weight:700;color:var(--lumina-gray-500);text-transform:uppercase;border-bottom:1px solid var(--lumina-gray-200);">Blog</th>
                        <th style="padding:0.75rem 1.25rem;text-align:left;font-size:0.75rem;font-weight:700;color:var(--lumina-gray-500);text-transform:uppercase;border-bottom:1px solid var(--lumina-gray-200);">Author</th>
                        <th style="padding:0.75rem 1.25rem;text-align:left;font-size:0.75rem;font-weight:700;color:var(--lumina-gray-500);text-transform:uppercase;border-bottom:1px solid var(--lumina-gray-200);">Status</th>
                        <th style="padding:0.75rem 1.25rem;text-align:left;font-size:0.75rem;font-weight:700;color:var(--lumina-gray-500);text-transform:uppercase;border-bottom:1px solid var(--lumina-gray-200);">Updated</th>
                        <th style="padding:0.75rem 1.25rem;text-align:left;font-size:0.75rem;font-weight:700;color:var(--lumina-gray-500);text-transform:uppercase;border-bottom:1px solid var(--lumina-gray-200);">Actions</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="blog : ${blogs}" style="border-bottom:1px solid var(--lumina-gray-100);">
                        <td style="padding:1rem 1.25rem;">
                            <div style="font-weight:700;color:var(--lumina-gray-900);font-size:0.875rem;" th:text="${blog.title}">Title</div>
                            <div style="font-size:0.75rem;color:var(--lumina-gray-500);margin-top:2px;" th:text="${#strings.abbreviate(blog.content, 140)}">Preview</div>
                            <div th:if="${blog.rejectionReason != null && !blog.rejectionReason.isBlank()}"
                                 style="margin-top:0.45rem;padding:0.35rem 0.55rem;background:#fef2f2;border:1px solid #fca5a5;border-radius:6px;font-size:0.75rem;color:#dc2626;">
                                <strong>Rejected:</strong> <span th:text="${blog.rejectionReason}"></span>
                            </div>
                        </td>
                        <td style="padding:1rem 1.25rem;font-size:0.875rem;color:var(--lumina-gray-700);"
                            th:text="${blog.authorName != null ? blog.authorName : 'User #' + blog.authorId}">Author</td>
                        <td style="padding:1rem 1.25rem;">
                            <span class="badge"
                                  th:classappend="${blog.status.name() == 'PUBLISHED' ? 'badge-success' : (blog.status.name() == 'PENDING_REVIEW' ? 'badge-warning' : (blog.status.name() == 'REJECTED' ? 'badge-danger' : 'badge-secondary'))}"
                                  th:text="${blog.status.name() == 'PENDING_REVIEW' ? 'Pending Review' : blog.status.name()}">Status</span>
                        </td>
                        <td style="padding:1rem 1.25rem;font-size:0.875rem;color:var(--lumina-gray-600);"
                            th:text="${blog.updatedAt == null ? 'Unknown' : #temporals.format(blog.updatedAt, 'dd/MM/yyyy HH:mm')}">Updated</td>
                        <td style="padding:1rem 1.25rem;min-width:240px;">
                            <div class="table-action-cell admin-blog-actions">
                                <form th:if="${blog.status.name() != 'HIDDEN' && blog.status.name() != 'ARCHIVED'}"
                                      th:action="@{'/admin/blogs/hide/' + ${blog.id}}" method="post" data-loading-form
                                      data-lumina-confirm
                                      data-dialog-preset="danger"
                                      data-dialog-title="Hide this blog?"
                                      data-dialog-object-label="Blog"
                                      th:data-dialog-object="${blog.title}"
                                      th:data-dialog-owner="${blog.authorName != null ? blog.authorName : 'User #' + blog.authorId}"
                                      th:data-dialog-current-status="${blog.status.name()}"
                                      data-dialog-next-status="HIDDEN"
                                      data-dialog-notice-title="The blog will leave public pages"
                                      data-dialog-notice-text="Moderation history and the original content will remain available to administrators."
                                      data-dialog-confirm-text="Hide blog"
                                      data-dialog-cancel-text="Keep visible">
                                    <input type="hidden" name="reason" value="Hidden by administrator.">
                                    <button type="submit" class="btn btn-secondary btn-sm">Hide</button>
                                </form>
                                <form th:if="${blog.status.name() != 'ARCHIVED'}"
                                      th:action="@{'/admin/blogs/archive/' + ${blog.id}}" method="post" data-loading-form
                                      data-lumina-confirm
                                      data-dialog-preset="danger"
                                      data-dialog-title="Archive this blog?"
                                      data-dialog-object-label="Blog"
                                      th:data-dialog-object="${blog.title}"
                                      th:data-dialog-owner="${blog.authorName != null ? blog.authorName : 'User #' + blog.authorId}"
                                      th:data-dialog-current-status="${blog.status.name()}"
                                      data-dialog-next-status="ARCHIVED"
                                      data-dialog-notice-title="The blog will move to the archive"
                                      data-dialog-notice-text="Archived content will no longer appear in active moderation or public views."
                                      data-dialog-confirm-text="Archive blog"
                                      data-dialog-cancel-text="Keep blog">
                                    <input type="hidden" name="reason" value="Archived by administrator.">
                                    <button type="submit" class="btn btn-danger btn-sm">Archive</button>
                                </form>
                            </div>
                            <span th:if="${blog.status.name() == 'ARCHIVED'}" style="font-size:0.8125rem;color:var(--lumina-gray-500);">Archived</span>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(blogs)}">
                        <td colspan="5" style="padding:4rem;text-align:center;color:var(--lumina-gray-400);">
                            No blogs have been created yet.
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </main>

    </div>
</div>

<script th:src="@{/js/admin/admin.js}"></script>
<script>
document.querySelectorAll('[data-loading-form]').forEach(function (form) {
    form.addEventListener('submit', function () {
        var loading = document.querySelector('[data-loading-message]');
        if (loading) loading.hidden = false;
    });
});
</script>
</body>
</html>
