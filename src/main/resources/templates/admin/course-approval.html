<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Moderation — Admin Portal | LumiNa</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@1,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/lumina-design-system.css}">
    <link rel="stylesheet" th:href="@{/css/admin/admin.css}">
</head>
<body>

<div class="lumina-portal">
    <aside th:replace="~{fragments/layout :: sidebar-admin}"></aside>

    <div class="lumina-portal-content" style="display:flex;flex-direction:column;min-height:100vh;">
        <div th:replace="~{fragments/layout :: topbar-admin('Course Moderation')}"></div>

        <main class="lumina-portal-main" style="flex:1;">
            <div class="page-header" style="margin-bottom:1.5rem;">
                <h1 class="page-title">Course Moderation Queue</h1>
                <p class="page-subtitle">Review, approve, reject, or manage submitted courses.</p>
            </div>

            <!-- Flash messages -->
            <div th:if="${successMessage}" style="margin-bottom:1rem;padding:0.75rem 1rem;background:#f0fdf4;border:1px solid #86efac;border-radius:8px;color:#15803d;font-size:0.875rem;font-weight:500;" th:text="${successMessage}"></div>
            <div th:if="${errorMessage}" style="margin-bottom:1rem;padding:0.75rem 1rem;background:#fef2f2;border:1px solid #fca5a5;border-radius:8px;color:#dc2626;font-size:0.875rem;font-weight:500;" th:text="${errorMessage}"></div>

            <!-- Status filter tabs -->
            <div class="admin-filter-tabs" style="display:flex;gap:0.5rem;margin-bottom:1.5rem;flex-wrap:wrap;">
                <a th:href="@{/admin/courses/approval(status='PENDING_APPROVAL')}"
                   th:classappend="${selectedStatus == 'PENDING_APPROVAL' ? ' active' : ''}"
                   class="filter-tab">
                    Pending <span class="badge badge-warning admin-filter-count" th:if="${pendingCount > 0}" th:text="${pendingCount}"></span>
                </a>
                <a th:href="@{/admin/courses/approval(status='APPROVED')}"
                   th:classappend="${selectedStatus == 'APPROVED' ? ' active' : ''}"
                   class="filter-tab">
                    Approved <span class="badge badge-success admin-filter-count" th:if="${approvedCount > 0}" th:text="${approvedCount}"></span>
                </a>
                <a th:href="@{/admin/courses/approval(status='HIDDEN')}"
                   th:classappend="${selectedStatus == 'HIDDEN' ? ' active' : ''}"
                   class="filter-tab">
                    Hidden <span class="badge badge-neutral admin-filter-count" th:if="${hiddenCount > 0}" th:text="${hiddenCount}"></span>
                </a>
                <a th:href="@{/admin/courses/approval(status='DRAFT')}"
                   th:classappend="${selectedStatus == 'DRAFT' ? ' active' : ''}"
                   class="filter-tab">
                    Draft <span class="badge badge-outline admin-filter-count" th:if="${draftCount > 0}" th:text="${draftCount}"></span>
                </a>
            </div>

            <!-- Courses Table -->
            <div class="admin-table-container">
                <div style="overflow-x:auto;">
                    <table class="lumina-table" style="width:100%;border-collapse:collapse;">
                        <thead>
                            <tr>
                                <th style="padding:0.75rem 1.25rem;text-align:left;font-size:0.75rem;font-weight:700;color:var(--lumina-gray-500);text-transform:uppercase;letter-spacing:0.05em;border-bottom:1px solid var(--lumina-gray-200);">Course</th>
                                <th style="padding:0.75rem 1.25rem;text-align:left;font-size:0.75rem;font-weight:700;color:var(--lumina-gray-500);text-transform:uppercase;letter-spacing:0.05em;border-bottom:1px solid var(--lumina-gray-200);">Instructor</th>
                                <th style="padding:0.75rem 1.25rem;text-align:left;font-size:0.75rem;font-weight:700;color:var(--lumina-gray-500);text-transform:uppercase;letter-spacing:0.05em;border-bottom:1px solid var(--lumina-gray-200);">Status</th>
                                <th style="padding:0.75rem 1.25rem;text-align:left;font-size:0.75rem;font-weight:700;color:var(--lumina-gray-500);text-transform:uppercase;letter-spacing:0.05em;border-bottom:1px solid var(--lumina-gray-200);">Price</th>
                                <th style="padding:0.75rem 1.25rem;text-align:right;font-size:0.75rem;font-weight:700;color:var(--lumina-gray-500);text-transform:uppercase;letter-spacing:0.05em;border-bottom:1px solid var(--lumina-gray-200);width:280px;">Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="crs : ${courses}"
                                style="border-bottom:1px solid var(--lumina-gray-100);">

                                <!-- Course info -->
                                <td style="padding:1rem 1.25rem;">
                                    <div style="font-weight:700;color:var(--lumina-gray-900);font-size:0.875rem;" th:text="${crs.title}">Title</div>
                                    <div style="font-size:0.75rem;color:var(--lumina-gray-500);margin-top:2px;" th:text="'ID #' + ${crs.id}"></div>
                                    <div style="font-size:0.75rem;color:var(--lumina-gray-500);margin-top:2px;">Estimated duration: <strong th:text="${crs.estimatedDurationDisplay}">45 mins</strong></div>
                                    <!-- Reject reason shown to admin too -->
                                    <div th:if="${crs.rejectReason != null && !crs.rejectReason.isBlank()}"
                                         style="margin-top:0.4rem;padding:0.3rem 0.5rem;background:#fef2f2;border:1px solid #fca5a5;border-radius:5px;font-size:0.72rem;color:#dc2626;">
                                        <strong>Rejection note:</strong> <span th:text="${crs.rejectReason}"></span>
                                    </div>
                                </td>

                                <!-- Instructor -->
                                <td style="padding:1rem 1.25rem;">
                                    <div style="font-weight:600;color:var(--lumina-gray-900);font-size:0.875rem;"
                                         th:text="${crs.instructorId != null ? 'Instructor #' + crs.instructorId : 'Unknown'}"></div>
                                </td>

                                <!-- Status badge -->
                                <td style="padding:1rem 1.25rem;">
                                    <span class="badge"
                                          th:classappend="${crs.status.name() == 'PENDING_APPROVAL' ? 'badge-warning' : (crs.status.name() == 'APPROVED' ? 'badge-success' : (crs.status.name() == 'HIDDEN' ? 'badge-secondary' : 'badge-secondary'))}"
                                          th:text="${crs.status}">PENDING</span>
                                </td>

                                <!-- Price -->
                                <td style="padding:1rem 1.25rem;font-size:0.875rem;font-weight:600;color:var(--lumina-gray-800);"
                                    th:text="${crs.price != null && crs.price.signum() == 0 ? 'Free' : (crs.price != null ? '$' + #numbers.formatDecimal(crs.price, 1, 'COMMA', 2, 'POINT') : 'N/A')}">Free</td>

                                <!-- Actions (state-aware) -->
                                <td style="padding:1rem 1.25rem;text-align:right;">
                                    <div class="table-action-cell admin-course-actions">

                                        <!-- APPROVE: only for PENDING_APPROVAL -->
                                        <form th:if="${crs.status.name() == 'PENDING_APPROVAL'}"
                                              th:action="@{'/admin/courses/approve/' + ${crs.id}}" method="post" style="display:inline;"
                                              data-lumina-confirm
                                              data-dialog-variant="warning"
                                              data-dialog-icon="course"
                                              data-dialog-eyebrow="Course moderation"
                                              data-dialog-badge="Publish course"
                                              data-dialog-title="Approve this course?"
                                              data-dialog-subtitle="The course will become available according to the current publication rules."
                                              data-dialog-object-label="Course"
                                              th:data-dialog-object="${crs.title}"
                                              th:data-dialog-owner="${crs.instructorId != null ? 'Instructor #' + crs.instructorId : 'Unknown'}"
                                              th:data-dialog-current-status="${crs.status.name()}"
                                              data-dialog-next-status="APPROVED"
                                              data-dialog-confirm-text="Approve course"
                                              data-dialog-cancel-text="Keep reviewing">
                                            <button type="submit" class="action-btn primary"
                                                    th:id="'btn-approve-' + ${crs.id}">
                                                <svg th:replace="~{fragments/icons :: icon('approve')}"></svg>
                                                <span>Approve</span>
                                            </button>
                                        </form>

                                        <!-- REJECT: only for PENDING_APPROVAL -->
                                        <form th:if="${crs.status.name() == 'PENDING_APPROVAL'}"
                                              th:action="@{'/admin/courses/reject/' + ${crs.id}}" method="post" style="display:inline;"
                                              data-lumina-confirm
                                              data-dialog-preset="danger"
                                              data-dialog-title="Reject this course?"
                                              data-dialog-subtitle="The course will leave the review queue and return to draft."
                                              data-dialog-object-label="Course"
                                              th:data-dialog-object="${crs.title}"
                                              th:data-dialog-owner="${crs.instructorId != null ? 'Instructor #' + crs.instructorId : 'Unknown'}"
                                              th:data-dialog-current-status="${crs.status.name()}"
                                              data-dialog-next-status="DRAFT"
                                              data-dialog-confirm-text="Reject course"
                                              data-dialog-cancel-text="Keep reviewing">
                                            <input type="hidden" name="rejectReason" value="Rejected by administrator.">
                                            <button type="submit" class="action-btn warning"
                                                    th:id="'btn-reject-' + ${crs.id}">
                                                <svg th:replace="~{fragments/icons :: icon('reject')}"></svg>
                                                <span>Reject</span>
                                            </button>
                                        </form>

                                        <!-- HIDE: only for APPROVED -->
                                        <form th:if="${crs.status.name() == 'APPROVED'}"
                                              th:action="@{'/admin/courses/hide/' + ${crs.id}}" method="post" style="display:inline;"
                                              data-lumina-confirm
                                              data-dialog-preset="danger"
                                              data-dialog-title="Hide this course?"
                                              data-dialog-object-label="Course"
                                              th:data-dialog-object="${crs.title}"
                                              th:data-dialog-current-status="${crs.status.name()}"
                                              data-dialog-next-status="HIDDEN"
                                              data-dialog-notice-title="Public visibility will change"
                                              data-dialog-notice-text="The course will be removed from the public catalog until it is restored."
                                              data-dialog-confirm-text="Hide course"
                                              data-dialog-cancel-text="Keep visible">
                                            <button type="submit" class="action-btn warning"
                                                    th:id="'btn-hide-' + ${crs.id}">
                                                <svg th:replace="~{fragments/icons :: icon('hide')}"></svg>
                                                <span>Hide</span>
                                            </button>
                                        </form>

                                        <!-- UNHIDE: only for HIDDEN -->
                                        <form th:if="${crs.status.name() == 'HIDDEN'}"
                                              th:action="@{'/admin/courses/unhide/' + ${crs.id}}" method="post" style="display:inline;"
                                              data-lumina-confirm
                                              data-dialog-variant="warning"
                                              data-dialog-icon="course"
                                              data-dialog-title="Restore this course?"
                                              data-dialog-object-label="Course"
                                              th:data-dialog-object="${crs.title}"
                                              th:data-dialog-current-status="${crs.status.name()}"
                                              data-dialog-next-status="APPROVED"
                                              data-dialog-notice-title="The course will be visible again"
                                              data-dialog-notice-text="Restoring makes the course available in the public catalog."
                                              data-dialog-confirm-text="Restore course"
                                              data-dialog-cancel-text="Keep hidden">
                                            <button type="submit" class="action-btn primary"
                                                    th:id="'btn-unhide-' + ${crs.id}">
                                                <svg th:replace="~{fragments/icons :: icon('restore')}"></svg>
                                                <span>Restore</span>
                                            </button>
                                        </form>

                                        <!-- DELETE: always available -->
                                        <form th:action="@{'/admin/courses/delete/' + ${crs.id}}" method="post" style="display:inline;"
                                              data-lumina-confirm
                                              data-dialog-preset="danger"
                                              data-dialog-title="Permanently delete this course?"
                                              data-dialog-object-label="Course"
                                              th:data-dialog-object="${crs.title}"
                                              data-dialog-notice-title="Course data will be permanently removed"
                                              data-dialog-notice-text="This action can affect lessons, videos, quizzes, enrollments and learner history."
                                              data-dialog-require-acknowledgement="true"
                                              data-dialog-acknowledgement-label="I understand that this course and its related data may not be recoverable."
                                              data-dialog-confirm-text="Permanently delete"
                                              data-dialog-cancel-text="Keep course">
                                            <button type="submit" class="action-btn danger"
                                                    th:id="'btn-delete-' + ${crs.id}">
                                                <svg th:replace="~{fragments/icons :: icon('delete')}"></svg>
                                                <span>Delete</span>
                                            </button>
                                        </form>

                                    </div>

                                </td>
                            </tr>

                            <!-- Empty state -->
                            <tr th:if="${#lists.isEmpty(courses)}">
                                <td colspan="5" style="padding:4rem;text-align:center;color:var(--lumina-gray-400);">
                                    <span class="empty-state-icon admin-table-empty-icon"><svg th:replace="~{fragments/icons :: icon('courses')}"></svg></span>
                                    <div>No courses with status <strong th:text="${selectedStatus}"></strong>.</div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </main>

        <footer th:replace="~{fragments/layout :: portal-footer}"></footer>
    </div>
</div>

<script th:src="@{/js/admin/admin.js}"></script>
</body>
</html>
