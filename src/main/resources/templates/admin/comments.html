<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comments - Admin Portal | LumiNa</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/lumina-design-system.css}">
    <link rel="stylesheet" th:href="@{/css/admin/admin.css}">
</head>
<body>
<div class="lumina-portal">
    <aside th:replace="~{fragments/layout :: sidebar-admin}"></aside>

    <div class="lumina-portal-content" style="display:flex;flex-direction:column;min-height:100vh;">
        <div th:replace="~{fragments/layout :: topbar-admin('Comments')}"></div>

        <main class="lumina-portal-main" style="flex:1;">
            <div class="page-header" style="display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:1.5rem;">
                <div>
                    <h1 class="page-title">Comments</h1>
                    <p class="page-subtitle">Hide or delete inappropriate blog comments while keeping moderation history.</p>
                </div>
                <a th:href="@{/admin/blogs}" class="btn btn-secondary">
                    <svg th:replace="~{fragments/icons :: icon('blog')}"></svg>
                    <span>Manage Blogs</span>
                </a>
            </div>

            <div th:if="${successMessage}" class="badge badge-success" style="margin-bottom:1rem;display:block;padding:0.65rem 1rem;border-radius:8px;font-size:0.875rem;font-weight:500;text-transform:none;" th:text="${successMessage}"></div>
            <div th:if="${errorMessage}" class="badge badge-danger" style="margin-bottom:1rem;display:block;padding:0.65rem 1rem;border-radius:8px;font-size:0.875rem;font-weight:500;text-transform:none;" th:text="${errorMessage}"></div>
            <div data-loading-message hidden style="margin-bottom:1rem;color:var(--lumina-gray-500);font-size:0.875rem;">Processing comment moderation...</div>

            <div class="admin-table-container" style="overflow-x:auto;">
                <div class="admin-table-toolbar">
                    <span style="font-weight:600;font-size:0.875rem;color:var(--lumina-gray-800);">
                        Blog Comments
                        <span th:text="'(' + ${#lists.size(comments)} + ')'" style="color:var(--lumina-gray-500);font-weight:400;"></span>
                    </span>
                </div>

                <table class="lumina-table" style="width:100%;border-collapse:collapse;">
                    <thead>
                    <tr>
                        <th style="padding:0.75rem 1.25rem;text-align:left;font-size:0.75rem;font-weight:700;color:var(--lumina-gray-500);text-transform:uppercase;border-bottom:1px solid var(--lumina-gray-200);">Comment</th>
                        <th style="padding:0.75rem 1.25rem;text-align:left;font-size:0.75rem;font-weight:700;color:var(--lumina-gray-500);text-transform:uppercase;border-bottom:1px solid var(--lumina-gray-200);">Blog</th>
                        <th style="padding:0.75rem 1.25rem;text-align:left;font-size:0.75rem;font-weight:700;color:var(--lumina-gray-500);text-transform:uppercase;border-bottom:1px solid var(--lumina-gray-200);">Author</th>
                        <th style="padding:0.75rem 1.25rem;text-align:left;font-size:0.75rem;font-weight:700;color:var(--lumina-gray-500);text-transform:uppercase;border-bottom:1px solid var(--lumina-gray-200);">Status</th>
                        <th style="padding:0.75rem 1.25rem;text-align:left;font-size:0.75rem;font-weight:700;color:var(--lumina-gray-500);text-transform:uppercase;border-bottom:1px solid var(--lumina-gray-200);">Created</th>
                        <th style="padding:0.75rem 1.25rem;text-align:left;font-size:0.75rem;font-weight:700;color:var(--lumina-gray-500);text-transform:uppercase;border-bottom:1px solid var(--lumina-gray-200);">Actions</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="comment : ${comments}" style="border-bottom:1px solid var(--lumina-gray-100);">
                        <td style="padding:1rem 1.25rem;">
                            <div style="font-size:0.875rem;color:var(--lumina-gray-800);line-height:1.6;" th:text="${#strings.abbreviate(comment.content, 180)}">Comment content</div>
                        </td>
                        <td style="padding:1rem 1.25rem;font-size:0.875rem;color:var(--lumina-gray-700);"
                            th:text="${comment.blogPostTitle != null ? comment.blogPostTitle : 'Blog #' + comment.blogPostId}">Blog</td>
                        <td style="padding:1rem 1.25rem;font-size:0.875rem;color:var(--lumina-gray-700);"
                            th:text="${comment.authorName != null ? comment.authorName : 'User #' + comment.authorId}">Author</td>
                        <td style="padding:1rem 1.25rem;">
                            <span class="badge admin-comment-status"
                                  th:classappend="${comment.status.name() == 'VISIBLE' ? 'badge-success' : (comment.status.name() == 'HIDDEN' ? 'badge-warning' : 'badge-danger')}"
                                  th:text="${comment.status.name()}">VISIBLE</span>
                        </td>
                        <td style="padding:1rem 1.25rem;font-size:0.875rem;color:var(--lumina-gray-600);"
                            th:text="${comment.createdAt == null ? 'Unknown' : #temporals.format(comment.createdAt, 'dd/MM/yyyy HH:mm')}">Created</td>
                        <td style="padding:1rem 1.25rem;min-width:240px;">
                            <div class="admin-comment-actions">
                            <details th:if="${comment.status.name() == 'VISIBLE'}">
                                <summary class="action-btn warning">
                                    <svg th:replace="~{fragments/icons :: icon('hide')}"></svg>
                                    <span>Hide</span>
                                </summary>
                                <form th:action="@{'/admin/comments/hide/' + ${comment.id}}" method="post" data-loading-form>
                                    <textarea name="reason" rows="2" maxlength="1000" required placeholder="Reason for hiding"
                                              style="width:100%;padding:0.5rem;border:1px solid var(--lumina-gray-300);border-radius:6px;font-size:0.8125rem;font-family:inherit;"></textarea>
                                    <button type="submit" class="action-btn warning" style="margin-top:0.4rem;"
                                            onclick="return confirm('Hide this comment from public pages?');">
                                        <svg th:replace="~{fragments/icons :: icon('hide')}"></svg>
                                        <span>Confirm Hide</span>
                                    </button>
                                </form>
                            </details>
                            <details th:if="${comment.status.name() != 'DELETED'}">
                                <summary class="action-btn danger">
                                    <svg th:replace="~{fragments/icons :: icon('delete')}"></svg>
                                    <span>Delete</span>
                                </summary>
                                <form th:action="@{'/admin/comments/delete/' + ${comment.id}}" method="post" data-loading-form>
                                    <textarea name="reason" rows="2" maxlength="1000" required placeholder="Reason for deleting"
                                              style="width:100%;padding:0.5rem;border:1px solid var(--lumina-gray-300);border-radius:6px;font-size:0.8125rem;font-family:inherit;"></textarea>
                                    <button type="submit" class="action-btn danger" style="margin-top:0.4rem;"
                                            onclick="return confirm('Delete this comment from public pages?');">
                                        <svg th:replace="~{fragments/icons :: icon('delete')}"></svg>
                                        <span>Confirm Delete</span>
                                    </button>
                                </form>
                            </details>
                            <span th:if="${comment.status.name() == 'DELETED'}" class="badge badge-neutral admin-comment-status-terminal">Deleted</span>
                            </div>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(comments)}">
                        <td colspan="6" style="padding:4rem;text-align:center;color:var(--lumina-gray-400);">
                            <span class="empty-state-icon admin-table-empty-icon"><svg th:replace="~{fragments/icons :: icon('comments')}"></svg></span>
                            <div>No blog comments have been posted yet.</div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </main>

        <div th:replace="~{fragments/layout :: portal-footer}"></div>
    </div>
</div>

<script th:src="@{/js/admin/admin.js}"></script>
<script>
document.querySelectorAll('[data-loading-form]').forEach(function (form) {
    form.addEventListener('submit', function () {
        var loading = document.querySelector('[data-loading-message]');
        if (loading) loading.hidden = false;
    });
});
</script>
</body>
</html>
