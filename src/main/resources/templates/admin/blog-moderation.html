<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Moderation - Admin Portal | LumiNa</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <th:block th:replace="~{fragments/theme-bootstrap :: bootstrap}"></th:block>
    <link rel="stylesheet" th:href="@{/css/lumina-design-system.css}">
    <link rel="stylesheet" th:href="@{/css/admin/admin.css}">
</head>
<body>
<div class="lumina-portal">
    <aside th:replace="~{fragments/layout :: sidebar-admin}"></aside>

    <div class="lumina-portal-content" style="display:flex;flex-direction:column;min-height:100vh;">
        <div th:replace="~{fragments/layout :: topbar-admin('Blog Moderation')}"></div>

        <main class="lumina-portal-main" style="flex:1;">
            <div class="page-header" style="display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:1.5rem;">
                <div>
                    <h1 class="page-title">Blog Moderation Queue</h1>
                    <p class="page-subtitle">Approve or reject submitted blog posts.</p>
                </div>
                <a th:href="@{/admin/blogs}" class="btn btn-secondary">
                    <svg th:replace="~{fragments/icons :: icon('blog')}"></svg>
                    <span>All Blogs</span>
                </a>
            </div>

            <div th:if="${successMessage}" style="margin-bottom:1rem;padding:0.75rem 1rem;background:#f0fdf4;border:1px solid #86efac;border-radius:8px;color:#15803d;font-size:0.875rem;font-weight:500;" th:text="${successMessage}"></div>
            <div th:if="${errorMessage}" style="margin-bottom:1rem;padding:0.75rem 1rem;background:#fef2f2;border:1px solid #fca5a5;border-radius:8px;color:#dc2626;font-size:0.875rem;font-weight:500;" th:text="${errorMessage}"></div>
            <div data-loading-message hidden style="margin-bottom:1rem;color:var(--lumina-gray-500);font-size:0.875rem;">Submitting moderation decision...</div>

            <div class="admin-table-container" style="overflow-x:auto;">
                <div class="admin-table-toolbar">
                    <span style="font-weight:600;font-size:0.875rem;color:var(--lumina-gray-800);">
                        Pending Review
                        <span th:text="'(' + ${#lists.size(blogs)} + ')'" style="color:var(--lumina-gray-500);font-weight:400;"></span>
                    </span>
                </div>

                <table class="lumina-table" style="width:100%;border-collapse:collapse;">
                    <thead>
                    <tr>
                        <th style="padding:0.75rem 1.25rem;text-align:left;font-size:0.75rem;font-weight:700;color:var(--lumina-gray-500);text-transform:uppercase;border-bottom:1px solid var(--lumina-gray-200);">Blog</th>
                        <th style="padding:0.75rem 1.25rem;text-align:left;font-size:0.75rem;font-weight:700;color:var(--lumina-gray-500);text-transform:uppercase;border-bottom:1px solid var(--lumina-gray-200);">Author</th>
                        <th style="padding:0.75rem 1.25rem;text-align:left;font-size:0.75rem;font-weight:700;color:var(--lumina-gray-500);text-transform:uppercase;border-bottom:1px solid var(--lumina-gray-200);">Submitted</th>
                        <th style="padding:0.75rem 1.25rem;text-align:right;font-size:0.75rem;font-weight:700;color:var(--lumina-gray-500);text-transform:uppercase;border-bottom:1px solid var(--lumina-gray-200);">Actions</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="blog : ${blogs}" style="border-bottom:1px solid var(--lumina-gray-100);">
                        <td style="padding:1rem 1.25rem;">
                            <div style="font-weight:700;color:var(--lumina-gray-900);font-size:0.875rem;" th:text="${blog.title}">Title</div>
                            <div class="admin-plain-excerpt"
                                 th:text="${#strings.abbreviate(blog.content != null ? #strings.escapeXml(blog.content).replaceAll('&lt;[^&gt;]*&gt;', ' ') : '', 180)}">Preview</div>
                        </td>
                        <td style="padding:1rem 1.25rem;font-size:0.875rem;color:var(--lumina-gray-700);"
                            th:text="${blog.authorName != null ? blog.authorName : 'User #' + blog.authorId}">Author</td>
                        <td style="padding:1rem 1.25rem;font-size:0.875rem;color:var(--lumina-gray-600);"
                            th:text="${blog.submittedAt == null ? 'Unknown' : #temporals.format(blog.submittedAt, 'dd/MM/yyyy HH:mm')}">Date</td>
                        <td style="padding:1rem 1.25rem;text-align:right;">
                            <div class="table-action-cell admin-blog-actions">
                                <form th:action="@{'/admin/blogs/approve/' + ${blog.id}}" method="post" style="display:inline;"
                                      data-loading-form
                                      onsubmit="return confirm('Approve and publish this blog?');">
                                    <button type="submit" class="action-btn primary">
                                        <svg th:replace="~{fragments/icons :: icon('approve')}"></svg>
                                        <span>Approve</span>
                                    </button>
                                </form>
                                <button type="button" class="action-btn warning"
                                        th:attr="data-modal-id='reject-blog-modal-' + ${blog.id}"
                                        onclick="openBlogRejectModal(this.dataset.modalId)">
                                    <svg th:replace="~{fragments/icons :: icon('reject')}"></svg>
                                    <span>Reject</span>
                                </button>
                            </div>

                            <div th:id="'reject-blog-modal-' + ${blog.id}"
                                 class="blog-reject-modal"
                                 style="display:none;position:fixed;inset:0;z-index:3000;background:rgba(15,23,42,0.45);align-items:center;justify-content:center;padding:1rem;">
                                <div style="width:min(520px,100%);background:var(--theme-surface);border-radius:8px;border:1px solid var(--lumina-gray-200);box-shadow:var(--shadow-xl);padding:1.5rem;text-align:left;">
                                    <div style="display:flex;justify-content:space-between;gap:1rem;align-items:flex-start;margin-bottom:1rem;">
                                        <div>
                                            <h2 style="font-size:1.05rem;color:var(--lumina-gray-900);margin:0;">Reject Blog</h2>
                                            <p style="font-size:0.8125rem;color:var(--lumina-gray-500);margin-top:0.25rem;" th:text="${blog.title}">Blog title</p>
                                        </div>
                                        <button type="button" class="action-btn"
                                                th:attr="data-modal-id='reject-blog-modal-' + ${blog.id}"
                                                onclick="closeBlogRejectModal(this.dataset.modalId)">
                                            <span>Close</span>
                                        </button>
                                    </div>
                                    <form th:action="@{'/admin/blogs/reject/' + ${blog.id}}" method="post" data-loading-form>
                                        <label th:for="'reject-reason-' + ${blog.id}" style="display:block;font-size:0.8125rem;font-weight:600;color:var(--lumina-gray-700);margin-bottom:0.5rem;">Rejection reason <span style="color:var(--lumina-danger);">*</span></label>
                                        <textarea th:id="'reject-reason-' + ${blog.id}" name="rejectionReason" rows="5" maxlength="1000" required
                                                  placeholder="Explain what the author needs to fix..."
                                                  style="width:100%;padding:0.75rem;border:1px solid var(--lumina-gray-300);border-radius:8px;font-size:0.875rem;resize:vertical;font-family:inherit;"></textarea>
                                        <div style="display:flex;justify-content:flex-end;gap:0.5rem;margin-top:1rem;">
                                            <button type="button" class="btn btn-secondary"
                                                    th:attr="data-modal-id='reject-blog-modal-' + ${blog.id}"
                                                    onclick="closeBlogRejectModal(this.dataset.modalId)">
                                                <span>Cancel</span>
                                            </button>
                                            <button type="submit" class="btn btn-danger-soft">
                                                <svg th:replace="~{fragments/icons :: icon('reject')}"></svg>
                                                <span>Reject Blog</span>
                                            </button>
                                        </div>
                                    </form>
                                </div>
                            </div>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(blogs)}">
                        <td colspan="4" style="padding:4rem;text-align:center;color:var(--lumina-gray-400);">
                            <span class="empty-state-icon admin-table-empty-icon"><svg th:replace="~{fragments/icons :: icon('blog')}"></svg></span>
                            <div>No blogs are waiting for review.</div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </main>

    </div>
</div>

<script th:src="@{/js/admin/admin.js}"></script>
<script>
function openBlogRejectModal(id) {
    var modal = document.getElementById(id);
    if (modal) {
        modal.style.display = 'flex';
        var textarea = modal.querySelector('textarea');
        if (textarea) {
            textarea.focus();
        }
    }
}

function closeBlogRejectModal(id) {
    var modal = document.getElementById(id);
    if (modal) {
        modal.style.display = 'none';
    }
}

document.querySelectorAll('[data-loading-form]').forEach(function (form) {
    form.addEventListener('submit', function () {
        var loading = document.querySelector('[data-loading-message]');
        if (loading) loading.hidden = false;
    });
});
</script>
</body>
</html>
