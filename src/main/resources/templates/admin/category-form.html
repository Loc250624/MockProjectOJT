<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${id != null ? 'Edit Category' : 'Create Category'} + ' — Admin Portal | LumiNa'">Category Form — Admin Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@1,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/lumina-design-system.css}">
    <link rel="stylesheet" th:href="@{/css/admin/admin.css}">
</head>
<body>

<div class="lumina-portal">
    <aside th:replace="~{fragments/layout :: sidebar-admin}"></aside>

    <div class="lumina-portal-content" style="display:flex;flex-direction:column;min-height:100vh;">
        <div th:replace="~{fragments/layout :: topbar-admin(${id != null ? 'Edit Category' : 'Create Category'})}"></div>

        <main class="lumina-portal-main">
            <div class="page-header" style="display:flex;align-items:center;gap:1rem;margin-bottom:1.5rem;">
                <a th:href="@{/admin/categories}" class="btn btn-secondary btn-sm" id="btn-back-categories">← Back</a>
                <div>
                    <h1 class="page-title" th:text="${id != null ? 'Edit Category' : 'Create New Category'}">Category Form</h1>
                    <p class="page-subtitle">Fill in the details below to save this category.</p>
                </div>
            </div>

            <!-- Error Message -->
            <div th:if="${errorMessage}" class="badge badge-danger" style="margin-bottom:1rem;display:block;padding:0.65rem 1rem;border-radius:8px;font-size:0.875rem;font-weight:500;text-transform:none;" th:text="${errorMessage}"></div>

            <!-- Form Card -->
            <div style="max-width:640px;">
                <div class="admin-table-container" style="padding:2rem;">
                    <form th:action="@{${id != null ? '/admin/categories/edit/' + id : '/admin/categories/create'}}"
                          th:object="${category}" method="post" id="category-form">

                        <!-- Name Field -->
                        <div style="margin-bottom:1.5rem;">
                            <label style="display:block;font-size:0.8125rem;font-weight:600;color:var(--lumina-gray-700);margin-bottom:0.5rem;" for="cat-name">
                                Category Name <span style="color:var(--lumina-danger);">*</span>
                            </label>
                            <input type="text" id="cat-name" th:field="*{name}"
                                   placeholder="e.g. Programming, Design, Business..."
                                   style="width:100%;padding:0.65rem 1rem;border:1px solid var(--lumina-gray-300);border-radius:8px;font-size:0.9375rem;color:var(--lumina-gray-800);transition:border-color 0.2s;outline:none;"
                                   onfocus="this.style.borderColor='var(--lumina-blue)'"
                                   onblur="this.style.borderColor='var(--lumina-gray-300)'">
                            <div th:if="${#fields.hasErrors('name')}" th:errors="*{name}"
                                 style="margin-top:0.35rem;font-size:0.8125rem;color:var(--lumina-danger);"></div>
                        </div>

                        <!-- Description Field -->
                        <div style="margin-bottom:2rem;">
                            <label style="display:block;font-size:0.8125rem;font-weight:600;color:var(--lumina-gray-700);margin-bottom:0.5rem;" for="cat-description">
                                Description
                            </label>
                            <textarea id="cat-description" th:field="*{description}" rows="4"
                                      placeholder="Briefly describe what this category covers..."
                                      style="width:100%;padding:0.65rem 1rem;border:1px solid var(--lumina-gray-300);border-radius:8px;font-size:0.9375rem;color:var(--lumina-gray-800);resize:vertical;transition:border-color 0.2s;outline:none;font-family:inherit;"
                                      onfocus="this.style.borderColor='var(--lumina-blue)'"
                                      onblur="this.style.borderColor='var(--lumina-gray-300)'"></textarea>
                            <div th:if="${#fields.hasErrors('description')}" th:errors="*{description}"
                                 style="margin-top:0.35rem;font-size:0.8125rem;color:var(--lumina-danger);"></div>
                        </div>

                        <!-- Actions -->
                        <div style="display:flex;gap:0.75rem;padding-top:1.5rem;border-top:1px solid var(--lumina-gray-200);">
                            <button type="submit" class="btn btn-primary" id="btn-save-category">
                                <span th:text="${id != null ? '💾 Save Changes' : '✅ Create Category'}">Save</span>
                            </button>
                            <a th:href="@{/admin/categories}" class="btn btn-secondary" id="btn-cancel-category">Cancel</a>
                        </div>

                    </form>
                </div>
            </div>
        </main>

        <div th:replace="~{fragments/layout :: portal-footer}"></div>
    </div>
</div>

<script th:src="@{/js/admin/admin.js}"></script>
</body>
</html>
