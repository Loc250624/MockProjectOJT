<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submission Grading</title>
    <link rel="stylesheet" th:href="@{/css/lumina-design-system.css}">
    <link rel="stylesheet" th:href="@{/css/teacher/teacher.css}">
</head>
<body th:attr="data-assignment-id=${assignmentId}">
<header th:replace="~{fragments/layout :: header('teacher')}"></header>
<div class="layout-container">
    <aside th:replace="~{fragments/layout :: sidebar-teacher}"></aside>
    <main class="main-content assessment-content">
        <h1>Submission Grading</h1>
        <section class="assessment-panel">
            <div class="empty-state" th:if="${submissions == null || #lists.isEmpty(submissions)}">No submissions yet.</div>
            <div class="assessment-list" th:unless="${submissions == null || #lists.isEmpty(submissions)}">
                <article class="assessment-card" th:each="submission : ${submissions}" th:attr="data-submission-id=${submission.id}">
                    <div class="assessment-heading inline">
                        <div>
                            <h3 th:text="${submission.studentName}">Student</h3>
                            <p th:text="${submission.status}">Status</p>
                        </div>
                        <button class="btn btn-secondary judge-submission-btn" type="button">Run mock judge</button>
                    </div>
                    <pre th:if="${submission.codeContent != null}" th:text="${submission.codeContent}">Code</pre>
                    <form class="teacher-grade-form assessment-form compact">
                        <input name="score" type="number" min="0" max="100" step="0.01" th:value="${submission.score}" placeholder="Score" required>
                        <textarea name="feedback" rows="3" placeholder="Feedback" required th:text="${submission.feedback}"></textarea>
                        <button class="btn btn-primary" type="submit">Save grade</button>
                    </form>
                </article>
            </div>
        </section>
    </main>
</div>
<script th:src="@{/js/teacher/teacher.js}"></script>
</body>
</html>
