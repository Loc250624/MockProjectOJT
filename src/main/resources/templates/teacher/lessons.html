<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Curriculum — Teacher Portal | LumiNa</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@1,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/lumina-design-system.css}">
    <link rel="stylesheet" th:href="@{/css/teacher/teacher.css}">
</head>
<body>

<div class="lumina-portal">
    <aside th:replace="~{fragments/layout :: sidebar-teacher}"></aside>

    <div class="lumina-portal-content" style="display:flex;flex-direction:column;min-height:100vh;">
        <div th:replace="~{fragments/layout :: topbar-teacher('Curriculum')}"></div>

        <main class="lumina-portal-main" style="flex:1;">
            <div class="page-header" style="display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:1.5rem;">
                <div>
                    <h1 class="page-title">Curriculum Management</h1>
                    <p class="page-subtitle">Select a course to manage its lessons and modules.</p>
                </div>
                <a th:if="${selectedCourseId != null}" th:href="@{'/teacher/lessons/create?courseId=' + ${selectedCourseId}}" class="btn btn-primary">
                    + Add Lesson
                </a>
            </div>

            <!-- Flash messages -->
            <div th:if="${successMessage}" class="badge badge-success" style="margin-bottom:1rem;display:block;padding:0.65rem 1rem;border-radius:8px;font-size:0.875rem;font-weight:500;text-transform:none;" th:text="${successMessage}"></div>
            <div th:if="${errorMessage}" class="badge badge-danger" style="margin-bottom:1rem;display:block;padding:0.65rem 1rem;border-radius:8px;font-size:0.875rem;font-weight:500;text-transform:none;" th:text="${errorMessage}"></div>

            <!-- Course Selection -->
            <div class="admin-table-container" style="padding:1.5rem;margin-bottom:1.5rem;">
                <form action="/teacher/lessons" method="get" style="display:flex;gap:1rem;align-items:center;">
                    <label style="font-weight:600;color:var(--lumina-gray-700);font-size:0.875rem;">Select Course:</label>
                    <select name="courseId" onchange="this.form.submit()" style="flex:1;padding:0.65rem 1rem;border:1px solid var(--lumina-gray-300);border-radius:8px;font-size:0.9375rem;color:var(--lumina-gray-800);background-color:#fff;outline:none;">
                        <option value="" th:selected="${selectedCourseId == null}">-- Select a Course --</option>
                        <option th:each="crs : ${courses}" th:value="${crs.id}" th:text="${crs.title}" th:selected="${crs.id == selectedCourseId}"></option>
                    </select>
                </form>
            </div>

            <!-- Lessons Table -->
            <div th:if="${selectedCourseId != null}" class="admin-table-container">
                <div class="admin-table-toolbar">
                    <div>
                        <span style="font-weight:600;font-size:0.875rem;color:var(--lumina-gray-800);">
                            Lessons for <span th:text="${selectedCourse.title}"></span>
                            <span th:text="'(' + ${#lists.size(lessons)} + ')'" style="color:var(--lumina-gray-500);font-weight:400;"></span>
                        </span>
                    </div>
                </div>
                <table class="data-table" style="width:100%;border-collapse:collapse;">
                    <thead>
                        <tr>
                            <th style="padding:0.75rem 1.5rem;text-align:left;font-size:0.75rem;font-weight:600;color:var(--lumina-gray-500);text-transform:uppercase;letter-spacing:0.05em;border-bottom:1px solid var(--lumina-gray-200);width:60px;">#</th>
                            <th style="padding:0.75rem 1.5rem;text-align:left;font-size:0.75rem;font-weight:600;color:var(--lumina-gray-500);text-transform:uppercase;letter-spacing:0.05em;border-bottom:1px solid var(--lumina-gray-200);">Title</th>
                            <th style="padding:0.75rem 1.5rem;text-align:left;font-size:0.75rem;font-weight:600;color:var(--lumina-gray-500);text-transform:uppercase;letter-spacing:0.05em;border-bottom:1px solid var(--lumina-gray-200);">Type</th>
                            <th style="padding:0.75rem 1.5rem;text-align:left;font-size:0.75rem;font-weight:600;color:var(--lumina-gray-500);text-transform:uppercase;letter-spacing:0.05em;border-bottom:1px solid var(--lumina-gray-200);">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="lessonTableBody">
                        <tr th:each="lsn : ${lessons}"
                            style="border-bottom:1px solid var(--lumina-gray-100);transition:background 0.15s;">
                            <td style="padding:1rem 1.5rem;font-size:0.875rem;color:var(--lumina-gray-500);font-weight:700;" th:text="${lsn.orderIndex}">1</td>
                            <td style="padding:1rem 1.5rem;">
                                <div style="font-size:0.875rem;font-weight:600;color:var(--lumina-gray-900);" th:text="${lsn.title}">Lesson Title</div>
                            </td>
                            <td style="padding:1rem 1.5rem;">
                                <span class="badge badge-info" th:text="${lsn.type}">VIDEO</span>
                            </td>
                            <td style="padding:1rem 1.5rem;">
                                <div style="display:flex;gap:0.5rem;align-items:center;">
                                    <a th:href="@{'/teacher/lessons/edit/' + ${lsn.id} + '?courseId=' + ${selectedCourseId}}"
                                       class="btn btn-secondary btn-sm">Edit</a>
                                    <form th:action="@{'/teacher/lessons/delete/' + ${lsn.id}}" method="post" style="display:inline;"
                                          onsubmit="return confirm('Are you sure you want to delete this lesson?');">
                                        <input type="hidden" name="courseId" th:value="${selectedCourseId}" />
                                        <button type="submit" class="btn btn-sm"
                                                style="background:var(--lumina-danger-bg);color:var(--lumina-danger);border:1px solid #fca5a5;">Delete</button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(lessons)}">
                            <td colspan="4" style="padding:3rem;text-align:center;color:var(--lumina-gray-400);font-style:italic;">
                                No lessons found. <a th:href="@{'/teacher/lessons/create?courseId=' + ${selectedCourseId}}" style="color:var(--lumina-blue);">Create your first lesson →</a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
            
            <div th:if="${selectedCourseId == null}" style="padding:4rem;text-align:center;color:var(--lumina-gray-400);">
                Please select a course from the dropdown above to manage its curriculum.
            </div>
        </main>

        <div th:replace="~{fragments/layout :: portal-footer}"></div>
    </div>
</div>

<script th:src="@{/js/teacher/teacher.js}"></script>
</body>
</html>
