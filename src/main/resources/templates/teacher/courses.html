<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Courses — Teacher Portal | LumiNa</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@1,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/lumina-design-system.css}">
    <link rel="stylesheet" th:href="@{/css/teacher/teacher.css}">
</head>
<body>

<div class="lumina-portal">
    <aside th:replace="~{fragments/layout :: sidebar-teacher}"></aside>

    <div class="lumina-portal-content" style="display:flex;flex-direction:column;min-height:100vh;">
        <div th:replace="~{fragments/layout :: topbar-teacher('My Courses')}"></div>

        <main class="lumina-portal-main" style="flex:1;">
            <div class="page-header" style="display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:1.5rem;">
                <div>
                    <h1 class="page-title">My Courses</h1>
                    <p class="page-subtitle">Manage your draft and published courses.</p>
                </div>
                <a th:href="@{/teacher/courses/create}" class="btn btn-primary" id="btn-add-course">
                    <svg th:replace="~{fragments/icons :: icon('create')}"></svg>
                    <span>Add Course</span>
                </a>
            </div>

            <!-- Flash messages -->
            <div th:if="${successMessage}" class="badge badge-success" style="margin-bottom:1rem;display:block;padding:0.65rem 1rem;border-radius:8px;font-size:0.875rem;font-weight:500;text-transform:none;" th:text="${successMessage}"></div>
            <div th:if="${errorMessage}" class="badge badge-danger" style="margin-bottom:1rem;display:block;padding:0.65rem 1rem;border-radius:8px;font-size:0.875rem;font-weight:500;text-transform:none;" th:text="${errorMessage}"></div>

            <!-- Courses Table -->
            <div class="admin-table-container">
                <div class="admin-table-toolbar">
                    <div>
                        <span style="font-weight:600;font-size:0.875rem;color:var(--lumina-gray-800);">
                            All Courses
                            <span th:text="'(' + ${#lists.size(courses)} + ')'" style="color:var(--lumina-gray-500);font-weight:400;"></span>
                        </span>
                    </div>
                    <div class="table-search">
                        <input type="text" id="courseSearch" placeholder="Search courses..." oninput="filterTable(this.value)">
                    </div>
                </div>
                <table class="data-table lumina-table teacher-course-table">
                    <thead>
                        <tr>
                            <th style="padding:0.75rem 1.5rem;text-align:left;font-size:0.75rem;font-weight:600;color:var(--lumina-gray-500);text-transform:uppercase;letter-spacing:0.05em;border-bottom:1px solid var(--lumina-gray-200);">#</th>
                            <th style="padding:0.75rem 1.5rem;text-align:left;font-size:0.75rem;font-weight:600;color:var(--lumina-gray-500);text-transform:uppercase;letter-spacing:0.05em;border-bottom:1px solid var(--lumina-gray-200);">Title</th>
                            <th style="padding:0.75rem 1.5rem;text-align:left;font-size:0.75rem;font-weight:600;color:var(--lumina-gray-500);text-transform:uppercase;letter-spacing:0.05em;border-bottom:1px solid var(--lumina-gray-200);">Price</th>
                            <th style="padding:0.75rem 1.5rem;text-align:left;font-size:0.75rem;font-weight:600;color:var(--lumina-gray-500);text-transform:uppercase;letter-spacing:0.05em;border-bottom:1px solid var(--lumina-gray-200);">Status</th>
                            <th style="padding:0.75rem 1.5rem;text-align:left;font-size:0.75rem;font-weight:600;color:var(--lumina-gray-500);text-transform:uppercase;letter-spacing:0.05em;border-bottom:1px solid var(--lumina-gray-200);">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="courseTableBody">
                        <tr th:each="crs, iterStat : ${courses}"
                            style="border-bottom:1px solid var(--lumina-gray-100);transition:background 0.15s;">
                            <td style="padding:1rem 1.5rem;font-size:0.875rem;color:var(--lumina-gray-500);font-family:monospace;" th:text="${iterStat.count}">1</td>
                            <td style="padding:1rem 1.5rem;">
                                <div style="display:flex;align-items:center;gap:1rem;">
                                    <div style="width:40px;height:40px;border-radius:8px;overflow:hidden;background:var(--lumina-gray-100);display:flex;align-items:center;justify-content:center;">
                                        <img th:if="${crs.thumbnailUrl != null && !crs.thumbnailUrl.isEmpty()}" th:src="${crs.thumbnailUrl}" style="width:100%;height:100%;object-fit:cover;" onerror="this.style.display='none'"/>
                                        <span th:unless="${crs.thumbnailUrl != null && !crs.thumbnailUrl.isEmpty()}" class="teacher-course-thumb-icon">
                                            <svg th:replace="~{fragments/icons :: icon('courses')}"></svg>
                                        </span>
                                    </div>
                                    <div>
                                        <div style="font-size:0.875rem;font-weight:600;color:var(--lumina-gray-900);" th:text="${crs.title}">Course Title</div>
                                        <div style="font-size:0.75rem;color:var(--lumina-gray-500);" th:text="${crs.categoryId != null ? 'Category ID: ' + crs.categoryId : 'No Category'}">Category</div>
                                    </div>
                                </div>
                            </td>
                            <td style="padding:1rem 1.5rem;font-size:0.875rem;font-weight:600;color:var(--lumina-green);" th:text="${crs.price == 0 ? 'Free' : '$' + #numbers.formatDecimal(crs.price, 1, 'COMMA', 2, 'POINT')}">Free</td>
                            <td style="padding:1rem 1.5rem;">
                                <!-- Status badge -->
                                <span class="badge"
                                      th:classappend="${crs.status.name() == 'DRAFT' ? 'badge-secondary' : (crs.status.name() == 'PENDING_APPROVAL' ? 'badge-warning' : (crs.status.name() == 'APPROVED' ? 'badge-success' : 'badge-secondary'))}"
                                      th:text="${crs.status}">DRAFT</span>
                                <!-- Rejection note -->
                                <div th:if="${crs.rejectReason != null && !crs.rejectReason.isBlank()}"
                                     style="margin-top:0.4rem;padding:0.4rem 0.6rem;background:#fef2f2;border:1px solid #fca5a5;border-radius:6px;font-size:0.75rem;color:#dc2626;">
                                    <strong>Rejected:</strong> <span th:text="${crs.rejectReason}"></span>
                                </div>
                            </td>
                            <td style="padding:1rem 1.5rem;">
                                <div class="table-action-cell teacher-course-actions">

                                    <!-- Edit: disabled for PENDING/APPROVED -->
                                    <a th:href="@{'/teacher/courses/edit/' + ${crs.id}}"
                                       class="action-btn"
                                       th:id="'btn-edit-crs-' + ${crs.id}"
                                       th:classappend="${crs.status.name() == 'PENDING_APPROVAL' || crs.status.name() == 'APPROVED' ? ' disabled' : ''}"
                                       th:title="${crs.status.name() == 'PENDING_APPROVAL' ? 'Cannot edit while under review' : (crs.status.name() == 'APPROVED' ? 'Cannot edit an approved course' : '')}">
                                        <svg th:replace="~{fragments/icons :: icon('edit')}"></svg>
                                        <span>Edit</span>
                                    </a>

                                     <!-- Manage Lessons link -->
                                     <a th:href="@{/teacher/lessons(courseId=${crs.id})}"
                                        class="action-btn"
                                        th:id="'btn-lessons-crs-' + ${crs.id}">
                                         <svg th:replace="~{fragments/icons :: icon('lessons')}"></svg>
                                         <span>Lessons</span>
                                     </a>

                                     <!-- Manage Videos link -->
                                     <a th:href="@{/teacher/videos(courseId=${crs.id})}"
                                        class="action-btn"
                                        th:id="'btn-videos-crs-' + ${crs.id}">
                                         <svg th:replace="~{fragments/icons :: icon('videos')}"></svg>
                                         <span>Videos</span>
                                     </a>

                                     <a th:href="@{/teacher/students(courseId=${crs.id})}"
                                        class="action-btn"
                                        th:id="'btn-students-crs-' + ${crs.id}">
                                         <svg th:replace="~{fragments/icons :: icon('students')}"></svg>
                                         <span>Students</span>
                                     </a>

                                     <a th:href="@{/teacher/reports/progress(courseId=${crs.id})}"
                                        class="action-btn"
                                        th:id="'btn-progress-crs-' + ${crs.id}">
                                         <svg th:replace="~{fragments/icons :: icon('progress')}"></svg>
                                         <span>Progress</span>
                                     </a>

                                    <!-- Submit: only for DRAFT -->
                                    <form th:if="${crs.status.name() == 'DRAFT'}"
                                          th:action="@{'/teacher/courses/submit/' + ${crs.id}}" method="post" style="display:inline;"
                                          onsubmit="return confirm('Submit this course for admin review?');">
                                        <button type="submit" class="action-btn primary"
                                                th:id="'btn-submit-crs-' + ${crs.id}">
                                            <svg th:replace="~{fragments/icons :: icon('upload')}"></svg>
                                            <span>Submit for Review</span>
                                        </button>
                                    </form>

                                    <!-- Withdraw: only for PENDING_APPROVAL -->
                                    <form th:if="${crs.status.name() == 'PENDING_APPROVAL'}"
                                          th:action="@{'/teacher/courses/withdraw/' + ${crs.id}}" method="post" style="display:inline;"
                                          onsubmit="return confirm('Withdraw this course from review?');">
                                        <button type="submit" class="action-btn warning"
                                                th:id="'btn-withdraw-crs-' + ${crs.id}">
                                            <svg th:replace="~{fragments/icons :: icon('restore')}"></svg>
                                            <span>Withdraw</span>
                                        </button>
                                    </form>

                                    <!-- Delete: only for DRAFT -->
                                    <form th:if="${crs.status.name() == 'DRAFT'}"
                                          th:action="@{'/teacher/courses/delete/' + ${crs.id}}" method="post" style="display:inline;"
                                          onsubmit="return confirm('Are you sure you want to delete this course?');">
                                        <button type="submit" class="action-btn danger"
                                                th:id="'btn-delete-crs-' + ${crs.id}">
                                            <svg th:replace="~{fragments/icons :: icon('delete')}"></svg>
                                            <span>Delete</span>
                                        </button>
                                    </form>

                                </div>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(courses)}">
                            <td colspan="5" style="padding:3rem;text-align:center;color:var(--lumina-gray-400);font-style:italic;">
                                No courses found. <a th:href="@{/teacher/courses/create}" style="color:var(--lumina-blue);">Create your first course →</a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </main>

        <div th:replace="~{fragments/layout :: portal-footer}"></div>
    </div>
</div>

<script th:src="@{/js/teacher/teacher.js}"></script>
<script>
function filterTable(query) {
    const rows = document.querySelectorAll('#courseTableBody tr');
    const q = query.toLowerCase();
    rows.forEach(row => {
        if (row.cells.length === 1) return;
        const text = row.textContent.toLowerCase();
        row.style.display = text.includes(q) ? '' : 'none';
    });
}
</script>
</body>
</html>
