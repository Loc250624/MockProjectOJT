<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Testcases</title>
    <link rel="stylesheet" th:href="@{/css/lumina-design-system.css}">
    <link rel="stylesheet" th:href="@{/css/teacher/teacher.css}">
</head>
<body th:attr="data-assignment-id=${assignmentId}">
<header th:replace="~{fragments/layout :: header('teacher')}"></header>
<div class="layout-container">
    <aside th:replace="~{fragments/layout :: sidebar-teacher}"></aside>
    <main class="main-content assessment-content">
        <h1>Code Judge Testcases</h1>
        <section class="assessment-panel">
            <form id="teacher-testcase-form" class="assessment-form compact">
                <textarea name="input" rows="3" placeholder="Input" required></textarea>
                <textarea name="expectedOutput" rows="3" placeholder="Expected output" required></textarea>
                <div class="assessment-grid-4">
                    <input name="points" type="number" min="0" step="0.01" value="1">
                    <input name="displayOrder" type="number" min="0" placeholder="Order">
                    <label class="assessment-checkbox"><input name="hidden" type="checkbox"> Hidden</label>
                </div>
                <button class="btn btn-primary" type="submit">Add testcase</button>
                <div class="assessment-message" id="teacher-testcase-message"></div>
            </form>
        </section>
        <section class="assessment-panel">
            <div class="empty-state" th:if="${testcases == null || #lists.isEmpty(testcases)}">No testcases configured.</div>
            <div class="assessment-list" th:unless="${testcases == null || #lists.isEmpty(testcases)}">
                <div class="result-row" th:each="testcase : ${testcases}">
                    <span th:text="${testcase.input}">Input</span>
                    <small th:text="${testcase.hidden ? 'Hidden' : 'Visible'}">Visible</small>
                </div>
            </div>
        </section>
    </main>
</div>
<script th:src="@{/js/teacher/teacher.js}"></script>
</body>
</html>
