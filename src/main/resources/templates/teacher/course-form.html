<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${editMode != null && editMode ? 'Edit Course' : 'Create Course'} + ' — Teacher Portal | LumiNa'">Course Form — Teacher Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@1,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/lumina-design-system.css}">
    <link rel="stylesheet" th:href="@{/css/teacher/teacher.css}">
</head>
<body>

<div class="lumina-portal">
    <aside th:replace="~{fragments/layout :: sidebar-teacher}"></aside>

    <div class="lumina-portal-content" style="display:flex;flex-direction:column;min-height:100vh;">
        <div th:replace="~{fragments/layout :: topbar-teacher(${editMode != null && editMode ? 'Edit Course' : 'Create Course'})}"></div>

        <main class="lumina-portal-main" style="flex:1;">
            <div class="page-header teacher-form-header">
                <a th:href="@{/teacher/courses}" class="btn btn-secondary btn-sm" id="btn-back-courses">
                    <svg th:replace="~{fragments/icons :: icon('previous')}"></svg>
                    <span>Back</span>
                </a>
                <div>
                    <h1 class="page-title" th:text="${editMode != null && editMode ? 'Edit Course' : 'Create New Course'}">Course Form</h1>
                    <p class="page-subtitle">Fill in the details below to save your draft course.</p>
                </div>
            </div>

            <!-- Error Message -->
            <div th:if="${errorMessage}" class="badge badge-danger" style="margin-bottom:1rem;display:block;padding:0.65rem 1rem;border-radius:8px;font-size:0.875rem;font-weight:500;text-transform:none;" th:text="${errorMessage}"></div>

            <!-- Form Card -->
            <div class="teacher-course-form-shell">
                <div class="admin-table-container teacher-course-form-card">
                    <form th:action="@{${editMode != null && editMode ? '/teacher/courses/edit/' + courseId : '/teacher/courses/create'}}"
                          th:object="${course}" method="post" id="course-form">

                        <section class="teacher-form-section" aria-labelledby="course-identity-heading">
                            <div class="teacher-form-section-head">
                                <span class="lumina-icon-box"><svg th:replace="~{fragments/icons :: icon('courses')}"></svg></span>
                                <div>
                                    <h2 id="course-identity-heading">Course identity</h2>
                                    <p>Title, artwork, category, roadmap, pricing, and student-facing description.</p>
                                </div>
                            </div>

                        <div class="teacher-form-grid">
                            <!-- Title Field -->
                            <div style="grid-column:1/-1;">
                                <label style="display:block;font-size:0.8125rem;font-weight:600;color:var(--lumina-gray-700);margin-bottom:0.5rem;" for="crs-title">
                                    Course Title <span style="color:var(--lumina-danger);">*</span>
                                </label>
                                <input type="text" id="crs-title" th:field="*{title}"
                                       placeholder="e.g. Master Spring Boot 3"
                                       style="width:100%;padding:0.65rem 1rem;border:1px solid var(--lumina-gray-300);border-radius:8px;font-size:0.9375rem;color:var(--lumina-gray-800);transition:border-color 0.2s;outline:none;"
                                       onfocus="this.style.borderColor='var(--lumina-blue)'"
                                       onblur="this.style.borderColor='var(--lumina-gray-300)'">
                                <div th:if="${#fields.hasErrors('title')}" th:errors="*{title}"
                                     style="margin-top:0.35rem;font-size:0.8125rem;color:var(--lumina-danger);"></div>
                            </div>

                            <!-- Thumbnail URL Field -->
                            <div style="grid-column:1/-1;">
                                <label style="display:block;font-size:0.8125rem;font-weight:600;color:var(--lumina-gray-700);margin-bottom:0.5rem;" for="crs-thumbnail">
                                    Thumbnail URL <span style="color:var(--lumina-danger);">*</span>
                                </label>
                                <input type="text" id="crs-thumbnail" th:field="*{thumbnailUrl}"
                                       placeholder="https://example.com/image.jpg"
                                       style="width:100%;padding:0.65rem 1rem;border:1px solid var(--lumina-gray-300);border-radius:8px;font-size:0.9375rem;color:var(--lumina-gray-800);transition:border-color 0.2s;outline:none;"
                                       onfocus="this.style.borderColor='var(--lumina-blue)'"
                                       onblur="this.style.borderColor='var(--lumina-gray-300)'">
                                <div th:if="${#fields.hasErrors('thumbnailUrl')}" th:errors="*{thumbnailUrl}"
                                     style="margin-top:0.35rem;font-size:0.8125rem;color:var(--lumina-danger);"></div>
                            </div>

                            <!-- Category Dropdown -->
                            <div>
                                <label style="display:block;font-size:0.8125rem;font-weight:600;color:var(--lumina-gray-700);margin-bottom:0.5rem;" for="crs-category">
                                    Category <span style="color:var(--lumina-danger);">*</span>
                                </label>
                                <select id="crs-category" th:field="*{categoryId}"
                                        style="width:100%;padding:0.65rem 1rem;border:1px solid var(--lumina-gray-300);border-radius:8px;font-size:0.9375rem;color:var(--lumina-gray-800);background-color:#fff;outline:none;cursor:pointer;">
                                    <option value="" disabled selected>-- Select a Category --</option>
                                    <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}"></option>
                                </select>
                                <div th:if="${#fields.hasErrors('categoryId')}" th:errors="*{categoryId}"
                                     style="margin-top:0.35rem;font-size:0.8125rem;color:var(--lumina-danger);"></div>
                            </div>

                            <!-- Roadmap Dropdown -->
                            <div>
                                <label style="display:block;font-size:0.8125rem;font-weight:600;color:var(--lumina-gray-700);margin-bottom:0.5rem;" for="crs-roadmap">
                                    Roadmap <span style="color:var(--lumina-danger);">*</span>
                                </label>
                                <select id="crs-roadmap" th:field="*{roadmapId}"
                                        style="width:100%;padding:0.65rem 1rem;border:1px solid var(--lumina-gray-300);border-radius:8px;font-size:0.9375rem;color:var(--lumina-gray-800);background-color:#fff;outline:none;cursor:pointer;">
                                    <option value="" disabled selected>-- Select a Roadmap --</option>
                                    <option th:each="rdm : ${roadmaps}" th:value="${rdm.id}" th:text="${rdm.title}"></option>
                                </select>
                                <div th:if="${#fields.hasErrors('roadmapId')}" th:errors="*{roadmapId}"
                                     style="margin-top:0.35rem;font-size:0.8125rem;color:var(--lumina-danger);"></div>
                            </div>

                            <!-- Price Field -->
                            <div style="grid-column:1/-1;">
                                <label style="display:block;font-size:0.8125rem;font-weight:600;color:var(--lumina-gray-700);margin-bottom:0.5rem;" for="crs-price">
                                    Price (USD) <span style="color:var(--lumina-danger);">*</span>
                                </label>
                                <input type="number" step="0.01" min="0" id="crs-price" th:field="*{price}"
                                       placeholder="0.00"
                                       style="width:100%;padding:0.65rem 1rem;border:1px solid var(--lumina-gray-300);border-radius:8px;font-size:0.9375rem;color:var(--lumina-gray-800);transition:border-color 0.2s;outline:none;"
                                       onfocus="this.style.borderColor='var(--lumina-blue)'"
                                       onblur="this.style.borderColor='var(--lumina-gray-300)'">
                                <div th:if="${#fields.hasErrors('price')}" th:errors="*{price}"
                                     style="margin-top:0.35rem;font-size:0.8125rem;color:var(--lumina-danger);"></div>
                            </div>

                            <!-- Description Field -->
                            <div style="grid-column:1/-1;margin-bottom:1rem;">
                                <label style="display:block;font-size:0.8125rem;font-weight:600;color:var(--lumina-gray-700);margin-bottom:0.5rem;" for="crs-description">
                                    Description <span style="color:var(--lumina-danger);">*</span>
                                </label>
                                <textarea id="crs-description" th:field="*{description}" rows="6"
                                          placeholder="Detail what students will learn, course prerequisites, etc..."
                                          style="width:100%;padding:0.65rem 1rem;border:1px solid var(--lumina-gray-300);border-radius:8px;font-size:0.9375rem;color:var(--lumina-gray-800);resize:vertical;transition:border-color 0.2s;outline:none;font-family:inherit;"
                                          onfocus="this.style.borderColor='var(--lumina-blue)'"
                                          onblur="this.style.borderColor='var(--lumina-gray-300)'"></textarea>
                                <div th:if="${#fields.hasErrors('description')}" th:errors="*{description}"
                                     style="margin-top:0.35rem;font-size:0.8125rem;color:var(--lumina-danger);"></div>
                            </div>
                        </div>
                        </section>

                        <!-- Actions -->
                        <div class="teacher-form-actions">
                            <a th:href="@{/teacher/courses}" class="btn btn-secondary" id="btn-cancel-course">
                                <svg th:replace="~{fragments/icons :: icon('reject')}"></svg>
                                <span>Cancel</span>
                            </a>
                            <button type="submit" class="btn btn-primary" id="btn-save-course">
                                <svg th:replace="~{fragments/icons :: icon('save')}"></svg>
                                <span th:text="${editMode != null && editMode ? 'Save Changes' : 'Save as Draft'}">Save</span>
                            </button>
                        </div>

                    </form>
                </div>
            </div>
        </main>

        <div th:replace="~{fragments/layout :: portal-footer}"></div>
    </div>
</div>

<script th:src="@{/js/teacher/teacher.js}"></script>
</body>
</html>
