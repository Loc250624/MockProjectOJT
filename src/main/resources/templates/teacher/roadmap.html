<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roadmap Management — Teacher Portal | LumiNa</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@1,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/lumina-design-system.css}">
    <link rel="stylesheet" th:href="@{/css/teacher/teacher.css}">
</head>
<body>

<div class="lumina-portal">
    <aside th:replace="~{fragments/layout :: sidebar-teacher}"></aside>

    <div class="lumina-portal-content" style="display:flex;flex-direction:column;min-height:100vh;">
        <div th:replace="~{fragments/layout :: topbar-teacher('Roadmaps')}"></div>

        <main class="lumina-portal-main" style="flex:1;">
            <div class="page-header" style="display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:1.5rem;">
                <div>
                    <h1 class="page-title">Roadmap Management</h1>
                    <p class="page-subtitle">Design curriculum roadmaps and paths for your students.</p>
                </div>
                <a th:href="@{/teacher/roadmap/create}" class="btn btn-primary" id="btn-add-roadmap">
                    + Add Roadmap
                </a>
            </div>

            <!-- Flash messages -->
            <div th:if="${successMessage}" class="badge badge-success" style="margin-bottom:1rem;display:block;padding:0.65rem 1rem;border-radius:8px;font-size:0.875rem;font-weight:500;text-transform:none;" th:text="${successMessage}"></div>
            <div th:if="${errorMessage}" class="badge badge-danger" style="margin-bottom:1rem;display:block;padding:0.65rem 1rem;border-radius:8px;font-size:0.875rem;font-weight:500;text-transform:none;" th:text="${errorMessage}"></div>

            <!-- Roadmaps Table -->
            <div class="admin-table-container">
                <div class="admin-table-toolbar">
                    <div>
                        <span style="font-weight:600;font-size:0.875rem;color:var(--lumina-gray-800);">
                            All Roadmaps
                            <span th:text="'(' + ${#lists.size(roadmaps)} + ')'" style="color:var(--lumina-gray-500);font-weight:400;"></span>
                        </span>
                    </div>
                    <div class="table-search">
                        <input type="text" id="roadmapSearch" placeholder="Search roadmaps..." oninput="filterTable(this.value)">
                    </div>
                </div>
                <table class="data-table responsive-data-table" style="width:100%;border-collapse:collapse;">
                    <thead>
                        <tr>
                            <th style="padding:0.75rem 1.5rem;text-align:left;font-size:0.75rem;font-weight:600;color:var(--lumina-gray-500);text-transform:uppercase;letter-spacing:0.05em;border-bottom:1px solid var(--lumina-gray-200);">ID</th>
                            <th style="padding:0.75rem 1.5rem;text-align:left;font-size:0.75rem;font-weight:600;color:var(--lumina-gray-500);text-transform:uppercase;letter-spacing:0.05em;border-bottom:1px solid var(--lumina-gray-200);">Title</th>
                            <th style="padding:0.75rem 1.5rem;text-align:left;font-size:0.75rem;font-weight:600;color:var(--lumina-gray-500);text-transform:uppercase;letter-spacing:0.05em;border-bottom:1px solid var(--lumina-gray-200);">Description</th>
                            <th style="padding:0.75rem 1.5rem;text-align:left;font-size:0.75rem;font-weight:600;color:var(--lumina-gray-500);text-transform:uppercase;letter-spacing:0.05em;border-bottom:1px solid var(--lumina-gray-200);">Created At</th>
                            <th style="padding:0.75rem 1.5rem;text-align:left;font-size:0.75rem;font-weight:600;color:var(--lumina-gray-500);text-transform:uppercase;letter-spacing:0.05em;border-bottom:1px solid var(--lumina-gray-200);">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="roadmapTableBody">
                        <tr th:each="rdm : ${roadmaps}"
                            style="border-bottom:1px solid var(--lumina-gray-100);transition:background 0.15s;">
                            <td data-label="ID" style="padding:1rem 1.5rem;font-size:0.875rem;color:var(--lumina-gray-500);font-family:monospace;" th:text="${rdm.id}">1</td>
                            <td class="responsive-primary" data-label="Roadmap" style="padding:1rem 1.5rem;">
                                <span style="font-size:0.875rem;font-weight:600;color:var(--lumina-gray-900);" th:text="${rdm.title}">Roadmap Title</span>
                            </td>
                            <td class="responsive-copy" data-label="Description" style="padding:1rem 1.5rem;font-size:0.875rem;color:var(--lumina-gray-600);max-width:350px;">
                                <details class="responsive-row-details">
                                    <summary>View description</summary>
                                    <div class="responsive-row-detail-content" th:text="${rdm.description}">Description</div>
                                </details>
                            </td>
                            <td data-label="Created" style="padding:1rem 1.5rem;font-size:0.875rem;color:var(--lumina-gray-500);" th:text="${#temporals.format(rdm.createdAt, 'MMM dd, yyyy HH:mm')}">Date</td>
                            <td data-label="Actions" style="padding:1rem 1.5rem;">
                                <div class="table-action-cell" style="gap:0.5rem;align-items:center;">
                                    <a th:href="@{'/teacher/roadmap/edit/' + ${rdm.id}}"
                                       class="btn btn-secondary btn-sm"
                                       th:id="'btn-edit-rdm-' + ${rdm.id}">Edit</a>
                                    <form th:action="@{'/teacher/roadmap/delete/' + ${rdm.id}}" method="post" style="display:inline;"
                                          data-lumina-confirm
                                          data-dialog-preset="danger"
                                          data-dialog-title="Delete this roadmap?"
                                          data-dialog-object-label="Roadmap"
                                          th:data-dialog-object="${rdm.title}"
                                          data-dialog-notice-title="This roadmap will be removed"
                                          data-dialog-notice-text="Students and teachers will no longer be able to use this learning path."
                                          data-dialog-require-acknowledgement="true"
                                          data-dialog-confirm-text="Delete roadmap"
                                          data-dialog-cancel-text="Keep roadmap">
                                        <button type="submit" class="btn btn-sm"
                                                style="background:var(--lumina-danger-bg);color:var(--lumina-danger);border:1px solid #fca5a5;"
                                                th:id="'btn-delete-rdm-' + ${rdm.id}">Delete</button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(roadmaps)}" data-empty-row>
                            <td colspan="5" style="padding:3rem;text-align:center;color:var(--lumina-gray-400);font-style:italic;">
                                No roadmaps found. <a th:href="@{/teacher/roadmap/create}" style="color:var(--lumina-blue);">Create your first roadmap →</a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </main>

        <div th:replace="~{fragments/layout :: portal-footer}"></div>
    </div>
</div>

<script th:src="@{/js/teacher/teacher.js}"></script>
<script>
function filterTable(query) {
    const rows = document.querySelectorAll('#roadmapTableBody tr');
    const q = query.toLowerCase();
    rows.forEach(row => {
        // Skip empty row message
        if (row.cells.length === 1) return;
        const text = row.textContent.toLowerCase();
        row.style.display = text.includes(q) ? '' : 'none';
    });
}
</script>
</body>
</html>
