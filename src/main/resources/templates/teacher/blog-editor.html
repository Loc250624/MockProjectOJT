<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Editor - Teacher Portal | LumiNa</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@1,700&display=swap" rel="stylesheet">
    <th:block th:replace="~{fragments/theme-bootstrap :: bootstrap}"></th:block>
    <link rel="stylesheet" th:href="@{/css/lumina-design-system.css}">
    <link rel="stylesheet" th:href="@{/css/teacher/teacher.css}">
</head>
<body>
<div class="lumina-portal">
    <aside th:replace="~{fragments/layout :: sidebar-teacher}"></aside>

    <div class="lumina-portal-content" style="display:flex;flex-direction:column;min-height:100vh;">
        <div th:replace="~{fragments/layout :: topbar-teacher('Blog Editor')}"></div>

        <main class="lumina-portal-main" style="flex:1;">
            <div class="page-header" style="display:flex;align-items:center;gap:1rem;margin-bottom:1.5rem;flex-wrap:wrap;">
                <a th:href="@{/teacher/blogs}" class="btn btn-secondary btn-sm">Back</a>
                <div>
                    <h1 class="page-title" th:text="${editMode == true} ? 'Edit Rejected Blog' : 'Write Blog Draft'">Write Blog Draft</h1>
                    <p class="page-subtitle" th:text="${editMode == true} ? 'Update the rejected post, then submit it again from My Blogs.' : 'Save a draft first, then submit it from My Blogs when it is ready.'">Save a draft first, then submit it from My Blogs when it is ready.</p>
                </div>
            </div>

            <div th:if="${errorMessage}" class="badge badge-danger" style="margin-bottom:1rem;display:block;padding:0.65rem 1rem;border-radius:8px;font-size:0.875rem;font-weight:500;text-transform:none;" th:text="${errorMessage}"></div>
            <div data-loading-message hidden style="margin-bottom:1rem;color:var(--lumina-gray-500);font-size:0.875rem;">Saving blog...</div>
            <div th:if="${editMode == true && rejectionReason != null && !rejectionReason.isBlank()}"
                 style="margin-bottom:1rem;padding:1rem;border:1px solid #fca5a5;border-radius:8px;background:#fef2f2;color:#991b1b;max-width:900px;">
                <div style="font-size:0.8125rem;font-weight:700;text-transform:uppercase;margin-bottom:0.35rem;">Rejection Reason</div>
                <div style="font-size:0.875rem;line-height:1.6;" th:text="${rejectionReason}">Needs revision.</div>
            </div>

            <div style="max-width:900px;">
                <div class="admin-table-container" style="padding:2.5rem;">
                    <form th:action="${editMode == true} ? @{'/teacher/blogs/' + ${blogId} + '/edit'} : @{/teacher/blogs}" th:object="${blogPost}" method="post" data-loading-form>
                        <div style="margin-bottom:1.5rem;">
                            <label for="blog-title" style="display:block;font-size:0.8125rem;font-weight:600;color:var(--lumina-gray-700);margin-bottom:0.5rem;">Title <span style="color:var(--lumina-danger);">*</span></label>
                            <input id="blog-title" type="text" th:field="*{title}" maxlength="180" placeholder="Give your blog a clear title"
                                   style="width:100%;padding:0.75rem 1rem;border:1px solid var(--lumina-gray-300);border-radius:8px;font-size:0.9375rem;color:var(--lumina-gray-800);outline:none;">
                            <div th:if="${#fields.hasErrors('title')}" th:errors="*{title}" style="margin-top:0.35rem;font-size:0.8125rem;color:var(--lumina-danger);"></div>
                        </div>

                        <div style="margin-bottom:1.5rem;">
                            <label for="blog-content" style="display:block;font-size:0.8125rem;font-weight:600;color:var(--lumina-gray-700);margin-bottom:0.5rem;">Content <span style="color:var(--lumina-danger);">*</span></label>
                            <textarea id="blog-content" th:field="*{content}" rows="16" placeholder="Write your draft here..."
                                      style="width:100%;padding:0.75rem 1rem;border:1px solid var(--lumina-gray-300);border-radius:8px;font-size:0.9375rem;color:var(--lumina-gray-800);resize:vertical;outline:none;font-family:inherit;"></textarea>
                            <div th:if="${#fields.hasErrors('content')}" th:errors="*{content}" style="margin-top:0.35rem;font-size:0.8125rem;color:var(--lumina-danger);"></div>
                        </div>

                        <div style="display:flex;gap:0.75rem;justify-content:flex-end;padding-top:1.5rem;border-top:1px solid var(--lumina-gray-200);">
                            <a th:href="@{/teacher/blogs}" class="btn btn-secondary">Cancel</a>
                            <button type="submit" class="btn btn-primary" th:text="${editMode == true} ? 'Save Changes' : 'Save Draft'">Save Draft</button>
                        </div>
                    </form>
                </div>
            </div>
        </main>

    </div>
</div>

<script th:src="@{/js/teacher/teacher.js}"></script>
<script>
document.querySelectorAll('[data-loading-form]').forEach(function (form) {
    form.addEventListener('submit', function () {
        var loading = document.querySelector('[data-loading-message]');
        if (loading) loading.hidden = false;
    });
});
</script>
</body>
</html>
