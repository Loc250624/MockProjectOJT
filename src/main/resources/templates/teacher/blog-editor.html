<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Editor - Teacher - OJTSU26 E-Learning</title>
    <link rel="stylesheet" th:href="@{/css/teacher/teacher.css}">
</head>
<body>
    <header th:replace="~{fragments/layout :: header('teacher')}"></header>
    <div class="layout-container">
        <aside th:replace="~{fragments/layout :: sidebar-teacher}"></aside>
        <main class="main-content">
            <h1>Blog Editor</h1>
            <form class="form-container"><div class="form-group"><label>Title</label><input type="text"></div><div class="form-group"><label>Category</label><select><option>Programming</option></select></div><div class="form-group"><label>Content</label><textarea></textarea></div><button class="btn btn-primary">Submit for Review</button></form>
        </main>
    </div>
    <footer th:replace="~{fragments/layout :: footer}"></footer>
    <script th:src="@{/js/teacher/teacher.js}"></script>
</body>
</html>
