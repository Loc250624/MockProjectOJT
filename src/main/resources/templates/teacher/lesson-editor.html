<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Curriculum Builder — Teacher Portal | LumiNa</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@1,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/lumina-design-system.css}">
    <link rel="stylesheet" th:href="@{/css/teacher/teacher.css}">
</head>
<body class="lumina-bg">

<!-- Editor Topbar -->
<header class="portal-topbar" style="justify-content:space-between;">
    <div class="breadcrumb">
        <a th:href="@{/teacher/dashboard}">Dashboard</a>
        <span class="sep">›</span>
        <a th:href="@{/teacher/lessons(courseId=${courseId})}">Lessons</a>
        <span class="sep">›</span>
        <span class="current" th:text="${selectedCourse != null ? selectedCourse.title : 'Course'}">Course Title</span>
    </div>
    <a th:replace="~{fragments/layout :: private-user-chip('/teacher/profile', 'Teacher', 'TEACHER')}"></a>
</header>

<main style="max-width:1200px;margin:2.5rem auto;padding:0 2rem;">
    
    <div class="page-header" style="display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:1.5rem;">
        <div>
            <h1 class="page-title" th:text="${editMode != null && editMode ? 'Edit Lesson' : 'Add New Lesson'}">Curriculum Builder</h1>
            <p class="page-subtitle">Manage lessons for your course.</p>
        </div>
        <a th:href="@{'/teacher/lessons/create?courseId=' + ${courseId}}" class="btn btn-outline">+ Add New Lesson</a>
    </div>

    <!-- Flash messages -->
    <div th:if="${successMessage}" class="badge badge-success" style="margin-bottom:1rem;display:block;padding:0.65rem 1rem;border-radius:8px;font-size:0.875rem;font-weight:500;text-transform:none;" th:text="${successMessage}"></div>
    <div th:if="${errorMessage}" class="badge badge-danger" style="margin-bottom:1rem;display:block;padding:0.65rem 1rem;border-radius:8px;font-size:0.875rem;font-weight:500;text-transform:none;" th:text="${errorMessage}"></div>

    <div class="builder-layout">
        
        <!-- Left: Lesson List -->
        <div>
            <div class="builder-module">
                <div class="b-mod-header">
                    <div style="flex:1;">
                        <div style="font-size:1rem;font-weight:700;color:var(--lumina-gray-900);">Existing Lessons</div>
                    </div>
                </div>
                <div class="b-lesson-list">
                    
                    <div th:each="lsn : ${lessons}" th:classappend="${lessonId != null && lsn.id == lessonId} ? 'active' : ''" class="b-lesson" style="cursor:pointer;" th:onclick="|window.location.href='@{/teacher/lessons/edit/}' + ${lsn.id} + '?courseId=' + ${courseId}|">
                        <div style="width:32px;height:32px;border-radius:8px;background:var(--lumina-blue-pale);color:var(--lumina-blue);display:flex;align-items:center;justify-content:center;font-size:0.875rem;" th:text="${lsn.orderIndex}">1</div>
                        <div style="flex:1;">
                            <div style="font-size:0.875rem;font-weight:600;color:var(--lumina-gray-900);" th:text="${lsn.title}">Lesson Title</div>
                            <div style="font-size:0.75rem;color:var(--lumina-gray-500);" th:text="${lsn.type}">Type</div>
                        </div>
                    </div>

                    <div th:if="${#lists.isEmpty(lessons)}" style="padding:1rem;font-size:0.875rem;color:var(--lumina-gray-500);text-align:center;">
                        No lessons yet.
                    </div>

                </div>
            </div>
        </div>

        <!-- Right: Lesson Settings Panel -->
        <div class="b-settings-panel">
            <form th:action="@{${editMode != null && editMode ? '/teacher/lessons/edit/' + lessonId : '/teacher/lessons/create'}}" th:object="${lesson}" method="post">
                <input type="hidden" th:field="*{courseId}" />
                
                <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1.5rem;">
                    <h3 style="font-size:1rem;font-weight:700;color:var(--lumina-gray-900);">Lesson Details</h3>
                </div>

                <div class="form-group">
                    <label class="form-label">LESSON TYPE <span style="color:var(--lumina-danger);">*</span></label>
                    <select class="form-control" th:field="*{type}">
                        <option value="" disabled selected>-- Select Type --</option>
                        <option th:each="t : ${lessonTypes}" th:value="${t}" th:text="${t}"></option>
                    </select>
                    <div th:if="${#fields.hasErrors('type')}" th:errors="*{type}" style="margin-top:0.35rem;font-size:0.8125rem;color:var(--lumina-danger);"></div>
                </div>

                <div class="form-group">
                    <label class="form-label">LESSON TITLE <span style="color:var(--lumina-danger);">*</span></label>
                    <input type="text" class="form-control" th:field="*{title}" placeholder="Enter lesson title">
                    <div th:if="${#fields.hasErrors('title')}" th:errors="*{title}" style="margin-top:0.35rem;font-size:0.8125rem;color:var(--lumina-danger);"></div>
                </div>

                <div class="form-group">
                    <label class="form-label">ORDER INDEX <span style="color:var(--lumina-danger);">*</span></label>
                    <input type="number" class="form-control" th:field="*{orderIndex}" placeholder="e.g. 1" min="1">
                    <div th:if="${#fields.hasErrors('orderIndex')}" th:errors="*{orderIndex}" style="margin-top:0.35rem;font-size:0.8125rem;color:var(--lumina-danger);"></div>
                </div>

                <div class="form-group">
                    <label class="form-label">CONTENT <span style="color:var(--lumina-danger);">*</span></label>
                    <textarea class="form-control" rows="5" th:field="*{content}" placeholder="Lesson content..."></textarea>
                    <div th:if="${#fields.hasErrors('content')}" th:errors="*{content}" style="margin-top:0.35rem;font-size:0.8125rem;color:var(--lumina-danger);"></div>
                </div>

                <div style="display:flex;gap:0.75rem;margin-top:2rem;">
                    <button type="submit" class="btn btn-primary" style="flex:1;">Save Lesson</button>
                    <a th:href="@{'/teacher/lessons?courseId=' + ${courseId}}" class="btn btn-outline" style="flex:1;text-align:center;">Cancel</a>
                </div>
            </form>

            <div th:if="${editMode != null && editMode && existingLesson != null}" class="assessment-panel" style="margin-top:1rem;padding:1rem;">
                <h3 style="font-size:1rem;font-weight:700;color:var(--lumina-gray-900);margin-bottom:0.5rem;">Lesson Content</h3>
                <p style="font-size:0.875rem;color:var(--lumina-gray-500);margin-bottom:1rem;">Create or manage the content attached to this lesson type.</p>
                <div style="display:flex;gap:0.75rem;flex-wrap:wrap;">
                    <a th:if="${existingLesson.type != null && existingLesson.type.name() == 'QUIZ'}"
                       th:href="@{/teacher/quizzes(courseId=${courseId},lessonId=${lessonId})}"
                       class="btn btn-secondary"
                       th:text="${existingLesson.hasQuiz ? 'Manage Quiz' : 'Create Quiz'}">Create Quiz</a>
                    <a th:if="${existingLesson.type != null && existingLesson.type.name() == 'VIDEO'}"
                       th:href="@{/teacher/videos(courseId=${courseId},lessonId=${lessonId})}"
                       class="btn btn-secondary">Manage Video</a>
                </div>
            </div>
        </div>

    </div>
</main>

<div th:replace="~{fragments/ai-chatbot :: widget}"></div>
<script th:src="@{/js/teacher/teacher.js}"></script>
</body>
</html>
