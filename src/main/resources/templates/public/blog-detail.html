<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${blog.title + ' - LumiNa'}">Blog Detail - LumiNa</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@1,700&display=swap" rel="stylesheet">
    <th:block th:replace="~{fragments/theme-bootstrap :: bootstrap}"></th:block>
    <link rel="stylesheet" th:href="@{/css/lumina-design-system.css}">
    <link rel="stylesheet" th:href="@{/css/public/public.css}">
</head>
<body>

<header th:replace="~{fragments/layout :: header('blogs')}"></header>

<main class="public-section" style="max-width:900px;">
    <a th:href="@{/blogs}" class="btn btn-secondary btn-sm" style="margin-bottom:1.5rem;">Back to Blogs</a>

    <div th:if="${successMessage}" class="badge badge-success" style="margin-bottom:1rem;display:block;padding:0.65rem 1rem;border-radius:8px;font-size:0.875rem;font-weight:500;text-transform:none;" th:text="${successMessage}"></div>
    <div th:if="${errorMessage}" class="badge badge-danger" style="margin-bottom:1rem;display:block;padding:0.65rem 1rem;border-radius:8px;font-size:0.875rem;font-weight:500;text-transform:none;" th:text="${errorMessage}"></div>

    <article data-ai-page-context style="background:var(--theme-surface);border:1px solid var(--lumina-gray-200);border-radius:8px;padding:2rem;margin-bottom:1.5rem;">
        <div style="font-size:0.75rem;font-weight:700;color:var(--lumina-blue);text-transform:uppercase;margin-bottom:0.75rem;"
             th:text="${blog.publishedAt == null ? 'Published' : #temporals.format(blog.publishedAt, 'dd MMM yyyy HH:mm')}">Published</div>
        <h1 class="section-heading" th:text="${blog.title}">Blog title</h1>
        <p style="font-size:0.875rem;color:var(--lumina-gray-500);margin-bottom:1.5rem;">
            By <strong th:text="${blog.authorName ?: 'LumiNa Author'}">Author</strong>
        </p>
        <div style="white-space:pre-wrap;font-size:1rem;line-height:1.8;color:var(--lumina-gray-700);" th:text="${blog.content}">Content</div>
    </article>

    <section style="background:var(--theme-surface);border:1px solid var(--lumina-gray-200);border-radius:8px;padding:2rem;">
        <div style="display:flex;align-items:center;justify-content:space-between;gap:1rem;margin-bottom:1.5rem;">
            <h2 style="font-size:1.25rem;font-weight:800;color:var(--lumina-gray-900);">Comments</h2>
            <span style="font-size:0.875rem;color:var(--lumina-gray-500);" th:text="${#lists.size(comments) + ' visible'}">0 visible</span>
        </div>

        <div th:if="${#lists.isEmpty(comments)}"
             style="padding:1.5rem;border:1px dashed var(--lumina-gray-300);border-radius:8px;text-align:center;color:var(--lumina-gray-500);margin-bottom:1.5rem;">
            No comments yet.
        </div>

        <div th:each="comment : ${comments}" style="padding:1rem 0;border-bottom:1px solid var(--lumina-gray-100);">
            <div style="display:flex;align-items:center;justify-content:space-between;gap:1rem;margin-bottom:0.4rem;">
                <strong style="font-size:0.875rem;color:var(--lumina-gray-900);" th:text="${comment.authorName ?: 'Learner'}">Learner</strong>
                <span style="font-size:0.75rem;color:var(--lumina-gray-400);"
                      th:text="${comment.createdAt == null ? '' : #temporals.format(comment.createdAt, 'dd/MM/yyyy HH:mm')}">Date</span>
            </div>
            <p style="font-size:0.875rem;color:var(--lumina-gray-700);line-height:1.6;white-space:pre-wrap;" th:text="${comment.content}">Comment</p>
        </div>

        <div th:if="${canComment}" style="margin-top:1.75rem;">
            <h3 style="font-size:1rem;font-weight:700;color:var(--lumina-gray-900);margin-bottom:0.75rem;">Leave a Comment</h3>
            <form th:action="@{'/blogs/' + ${blog.id} + '/comments'}" th:object="${comment}" method="post" data-comment-form>
                <textarea th:field="*{content}" rows="4" maxlength="2000" placeholder="Write your comment..."
                          style="width:100%;padding:0.75rem 1rem;border:1px solid var(--lumina-gray-300);border-radius:8px;font-size:0.9375rem;color:var(--lumina-gray-800);resize:vertical;outline:none;font-family:inherit;"></textarea>
                <div th:if="${#fields.hasErrors('content')}" th:errors="*{content}" style="margin-top:0.35rem;font-size:0.8125rem;color:var(--lumina-danger);"></div>
                <div data-comment-loading hidden style="margin-top:0.75rem;color:var(--lumina-gray-500);font-size:0.875rem;">Posting comment...</div>
                <div style="margin-top:1rem;display:flex;justify-content:flex-end;">
                    <button type="submit" class="btn btn-primary">Post Comment</button>
                </div>
            </form>
        </div>

        <div th:unless="${canComment}"
             style="margin-top:1.75rem;padding:1rem;border:1px solid var(--lumina-gray-200);border-radius:8px;background:var(--lumina-gray-50);color:var(--lumina-gray-600);">
            Guests can read published blogs. <a th:href="@{/auth/login}" style="color:var(--lumina-blue);font-weight:700;">Log in</a> to leave a comment.
        </div>
    </section>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>

<script th:src="@{/js/public/public.js}"></script>
<script>
    document.querySelectorAll('[data-comment-form]').forEach(function (form) {
        form.addEventListener('submit', function () {
            var loading = form.querySelector('[data-comment-loading]');
            if (loading) loading.hidden = false;
        });
    });
</script>
</body>
</html>
