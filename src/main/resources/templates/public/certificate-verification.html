<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Certificate Verification | LumiNa</title>
    <th:block th:replace="~{fragments/theme-bootstrap :: bootstrap}"></th:block>
    <link rel="stylesheet" th:href="@{/css/lumina-design-system.css}">
    <link rel="stylesheet" th:href="@{/css/public/public.css}">
</head>
<body>
<header th:replace="~{fragments/layout :: header('public')}"></header>

<main class="public-section" style="min-height:60vh;">
    <div style="max-width:760px;margin:0 auto;">
        <div class="section-eyebrow">Credential Verification</div>
        <h1 class="section-heading">Certificate Verification</h1>

        <div class="card card-padded" th:if="${verification.valid}">
            <span class="badge badge-success badge-dot">Certificate is valid</span>
            <h2 class="card-title" style="margin-top:1rem;" th:text="${verification.courseNameSnapshot}">Course</h2>
            <p><strong>Student:</strong> <span th:text="${verification.studentNameSnapshot}">Student</span></p>
            <p><strong>Teacher:</strong> <span th:text="${verification.teacherNameSnapshot}">Teacher</span></p>
            <p><strong>Issued:</strong> <span th:text="${#temporals.format(verification.issuedAt, 'yyyy-MM-dd')}">2026-01-01</span></p>
            <p><strong>Verification code:</strong> <span th:text="${verification.verificationCode}">CODE</span></p>
        </div>

        <div class="card card-padded" th:unless="${verification.valid}">
            <span class="badge badge-danger badge-dot" th:text="${verification.status == 'REVOKED' ? 'Certificate has been revoked' : (verification.status == 'INVALID_CODE' ? 'Verification code is invalid' : 'Certificate was not found')}">Certificate was not found</span>
            <p class="page-subtitle" style="margin-top:1rem;">Only public certificate snapshot data is shown on this page.</p>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
