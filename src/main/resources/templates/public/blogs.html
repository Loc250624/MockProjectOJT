<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blogs - LumiNa</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@1,700&display=swap" rel="stylesheet">
    <th:block th:replace="~{fragments/theme-bootstrap :: bootstrap}"></th:block>
    <link rel="stylesheet" th:href="@{/css/lumina-design-system.css}">
    <link rel="stylesheet" th:href="@{/css/public/public.css}">
</head>
<body>

<header th:replace="~{fragments/layout :: header('blogs')}"></header>

<main class="public-section">
    <div style="display:flex;align-items:flex-end;justify-content:space-between;gap:1rem;margin-bottom:2rem;flex-wrap:wrap;">
        <div>
            <div class="section-eyebrow">Community Writing</div>
            <h1 class="section-heading">Published Blogs</h1>
            <p class="section-lead">Read articles from LumiNa learners and instructors.</p>
        </div>
        <div style="font-size:0.875rem;color:var(--lumina-gray-500);">
            <span data-blog-count th:text="${#lists.size(blogs)}">0</span> published posts
        </div>
    </div>

    <div th:if="${successMessage}" class="badge badge-success" style="margin-bottom:1rem;display:block;padding:0.65rem 1rem;border-radius:8px;font-size:0.875rem;font-weight:500;text-transform:none;" th:text="${successMessage}"></div>
    <div th:if="${errorMessage}" class="badge badge-danger" style="margin-bottom:1rem;display:block;padding:0.65rem 1rem;border-radius:8px;font-size:0.875rem;font-weight:500;text-transform:none;" th:text="${errorMessage}"></div>

    <form th:action="@{/blogs}"
          method="get"
          class="catalog-search-row"
          role="search"
          data-live-search-form
          data-live-search-target="#blog-live-results"
          data-live-search-count-target="[data-blog-count]"
          data-live-search-loading-target="[data-blog-search-loading]"
          data-live-search-error-target="[data-blog-search-error]">
        <div class="search-wrap">
            <span style="color:var(--lumina-gray-400);font-size:0.9rem;" aria-hidden="true">
                <svg th:replace="~{fragments/icons :: icon('search')}"></svg>
            </span>
            <input type="search"
                   name="keyword"
                   th:value="${keyword}"
                   placeholder="Search published blogs..."
                   aria-label="Search published blogs"
                   autocomplete="off"
                   data-live-search-input>
        </div>
    </form>
    <div data-blog-search-loading hidden role="status" style="margin-bottom:1rem;color:var(--lumina-gray-500);font-size:0.875rem;">Loading blogs...</div>
    <div data-blog-search-error hidden role="alert" style="margin-bottom:1rem;color:var(--lumina-danger);font-size:0.875rem;"></div>

    <div id="blog-live-results" aria-live="polite">
        <div th:if="${#lists.isEmpty(blogs)}"
             style="background:var(--theme-surface);border:1px solid var(--lumina-gray-200);border-radius:8px;padding:3rem;text-align:center;color:var(--lumina-gray-500);">
            No published blogs are available yet.
        </div>

        <div th:unless="${#lists.isEmpty(blogs)}"
             style="display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:1.25rem;">
            <article th:each="blog : ${blogs}"
                     class="public-course-card"
                     data-ai-page-context
                     style="padding:1.5rem;">
                <div style="font-size:0.75rem;font-weight:700;color:var(--lumina-blue);text-transform:uppercase;margin-bottom:0.75rem;"
                     th:text="${blog.publishedAt == null ? 'Published' : #temporals.format(blog.publishedAt, 'dd MMM yyyy')}">Published</div>
                <h2 style="font-size:1.125rem;line-height:1.35;margin-bottom:0.5rem;">
                    <a th:href="@{'/blogs/' + ${blog.id}}" th:text="${blog.title}" style="color:var(--lumina-gray-900);text-decoration:none;">Blog title</a>
                </h2>
                <p style="font-size:0.8125rem;color:var(--lumina-gray-500);margin-bottom:1rem;">
                    By <strong th:text="${blog.authorName ?: 'LumiNa Author'}">Author</strong>
                </p>
                <p style="font-size:0.875rem;color:var(--lumina-gray-600);line-height:1.7;margin-bottom:1.25rem;"
                   th:text="${#strings.abbreviate(blog.content, 180)}">Preview</p>
                <a th:href="@{'/blogs/' + ${blog.id}}" class="btn btn-secondary btn-sm">Read</a>
            </article>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>

<script th:src="@{/js/public/public.js}"></script>
<script th:src="@{/js/live-search.js}"></script>
</body>
</html>
