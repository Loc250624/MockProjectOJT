<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - LumiNa E-Learning</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@1,700&display=swap" rel="stylesheet">
    <th:block th:replace="~{fragments/theme-bootstrap :: bootstrap}"></th:block>
    <link rel="stylesheet" th:href="@{/css/lumina-design-system.css}">
    <link rel="stylesheet" th:href="@{/css/auth/auth.css}">
</head>
<body>

<div class="auth-theme-switch"><th:block th:replace="~{fragments/theme-switch :: themeSwitch}"></th:block></div>

<div class="auth-center-page">
    <header class="auth-center-header">
        <a th:href="@{/}" class="logo">
            <div style="width:28px;height:28px;background:var(--lumina-blue);border-radius:7px;display:flex;align-items:center;justify-content:center;color:white;font-size:0.85rem;">L</div>
            <span>LumiNa</span>
        </a>
        <span class="portal-label">Portal Access</span>
    </header>

    <div class="auth-center-body">
        <div class="auth-center-card">
            <h1 class="card-title blue" style="font-style:italic;margin-bottom:0.5rem;">Reset Password</h1>
            <p class="card-desc">Enter a new password for this local LumiNa account.</p>

            <div th:if="${error}" class="badge badge-danger" style="margin-bottom:1rem;display:block;padding:0.65rem 1rem;border-radius:8px;font-size:0.875rem;font-weight:500;text-transform:none;">
                <span th:text="${error}">Reset link is invalid or expired.</span>
            </div>

            <form th:action="@{/auth/reset-password}" method="post">
                <input type="hidden" name="token" th:value="${token}">

                <div class="form-group">
                    <label class="form-label" for="password">New Password</label>
                    <div class="input-group">
                        <span class="input-icon">*</span>
                        <input type="password" id="password" name="password"
                               class="form-control"
                               minlength="8" maxlength="72"
                               autocomplete="new-password"
                               required>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="confirmPassword">Confirm Password</label>
                    <div class="input-group">
                        <span class="input-icon">*</span>
                        <input type="password" id="confirmPassword" name="confirmPassword"
                               class="form-control"
                               minlength="8" maxlength="72"
                               autocomplete="new-password"
                               required>
                    </div>
                </div>

                <p class="card-desc" style="font-size:0.8125rem;margin-bottom:1rem;">
                    Use 8-72 characters with lowercase, uppercase, number, special character, and no spaces.
                </p>

                <button type="submit" class="auth-submit" id="btn-reset-password">
                    Reset Password
                </button>
            </form>

            <hr class="divider-line" style="margin-top:1.5rem;">

            <a th:href="@{/auth/login}" class="auth-center-back">
                Back to Login
            </a>
        </div>
    </div>
</div>

<script th:src="@{/js/theme.js}" defer></script>
</body>
</html>
