<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - OJTSU26 E-Learning</title>
    <link rel="stylesheet" th:href="@{/css/auth/auth.css}">
</head>
<body>

<!-- Header -->
<header th:replace="~{fragments/layout :: header('public')}"></header>

<main class="main-content-full">
    <div class="auth-form">
        <h1>Login</h1>
        <form th:action="@{/auth/login}" method="post">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="Enter your email" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter your password" required>
            </div>
            <button type="submit" class="btn-primary">Login</button>
        </form>
        <div class="auth-links">
            <p>Don't have an account? <a th:href="@{/auth/register}">Register</a></p>
            <p>Or login with <a th:href="@{/auth/oauth-login}">OAuth</a></p>
        </div>
    </div>
</main>

<!-- Footer -->
<footer th:replace="~{fragments/layout :: footer}"></footer>

<script th:src="@{/js/auth/auth.js}"></script>
</body>
</html>
