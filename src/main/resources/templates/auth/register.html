<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Create your LumiNa academic profile and join the elite learning community.">
    <title>Create Account — LumiNa E-Learning</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@1,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/lumina-design-system.css}">
    <link rel="stylesheet" th:href="@{/css/auth/auth.css}">
</head>
<body>

<div class="auth-page-simple">

    <!-- Header -->
    <header class="auth-simple-header">
        <a th:href="@{/}" class="auth-logo" style="text-decoration:none;">
            <div class="logo-icon">🎓</div>
            <span>LumiNa</span>
        </a>
        <a th:href="@{/auth/login}" class="btn btn-sm btn-secondary">Support</a>
    </header>

    <!-- Body -->
    <div class="auth-simple-body">
        <div class="auth-simple-card">

            <h1 class="card-heading">Join the Elite</h1>
            <p class="card-sub">Create your academic profile to access LumiNa.</p>

            <!-- Error / Success -->
            <div th:if="${error}" class="badge badge-danger" style="margin-bottom:1rem;display:block;padding:0.65rem 1rem;border-radius:8px;font-size:0.875rem;font-weight:500;text-transform:none;">
                ⚠ <span th:text="${error}">Error.</span>
            </div>
            <div th:if="${message}" class="badge badge-success" style="margin-bottom:1rem;display:block;padding:0.65rem 1rem;border-radius:8px;font-size:0.875rem;font-weight:500;text-transform:none;">
                ✓ <span th:text="${message}">Success.</span>
            </div>

            <form th:action="@{/auth/register}" method="post" id="register-form">

                <div class="form-group">
                    <label class="form-label" for="name">Full Name</label>
                    <div class="input-group">
                        <span class="input-icon">👤</span>
                        <input type="text" id="name" name="name"
                               class="form-control"
                               placeholder="Johnathan Miller"
                               required autocomplete="name">
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="email">Institutional Email</label>
                    <div class="input-group">
                        <span class="input-icon">✉</span>
                        <input type="email" id="email" name="email"
                               class="form-control"
                               placeholder="name@institution.edu"
                               required autocomplete="email">
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="role">Role</label>
                    <div class="input-group">
                        <span class="input-icon">🏷</span>
                        <select id="role" name="role" class="form-control" required style="padding-left:2.4rem;">
                            <option value="">-- Select Role --</option>
                            <option value="student">Student</option>
                            <option value="teacher">Teacher / Instructor</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <div class="input-group">
                        <span class="input-icon">🔒</span>
                        <input type="password" id="password" name="password"
                               class="form-control"
                               placeholder="••••••••"
                               required autocomplete="new-password"
                               minlength="8">
                    </div>
                    <div class="password-strength-bar">
                        <div class="password-strength-fill" id="strength-fill"></div>
                    </div>
                    <div class="strength-labels">
                        <span>Security Level</span>
                        <span>Min. 8 chars</span>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="confirmPassword">Confirm Password</label>
                    <div class="input-group">
                        <span class="input-icon">🛡</span>
                        <input type="password" id="confirmPassword" name="confirmPassword"
                               class="form-control"
                               placeholder="••••••••"
                               required autocomplete="new-password">
                    </div>
                </div>

                <div class="form-check" style="margin-bottom:1.25rem;">
                    <input type="checkbox" id="terms" name="terms" required>
                    <label for="terms">
                        I agree to the <a href="#">Academic Honor Code</a> and <a href="#">Privacy Policy</a> of LumiNa Systems.
                    </label>
                </div>

                <button type="submit" class="auth-submit" id="btn-register">
                    Create Account →
                </button>
            </form>

            <hr class="divider-line" style="margin-top:1.5rem;">

            <p style="text-align:center;font-size:0.875rem;color:var(--lumina-gray-500);padding-top:0.5rem;">
                Already registered?
                <a th:href="@{/auth/login}" style="color:var(--lumina-blue);font-weight:700;">Back to Login</a>
            </p>
        </div>
    </div>

    <!-- Footer -->
    <footer class="auth-center-footer">
        <div>
            <span class="footer-brand">LumiNa</span>
            <span style="color:var(--lumina-gray-400);font-size:0.8125rem;"> | © 2024 LumiNa E-Learning Systems. All rights reserved.</span>
        </div>
        <div class="footer-links">
            <a th:href="@{/privacy}">Privacy Policy</a>
            <a th:href="@{/terms}">Terms of Service</a>
            <a th:href="@{/accessibility}">Accessibility</a>
            <a th:href="@{/contact}">Contact</a>
        </div>
    </footer>

</div>

<script th:src="@{/js/auth/auth.js}"></script>
<script>
    // Password strength meter
    const pw = document.getElementById('password');
    const fill = document.getElementById('strength-fill');
    const colors = ['#ef4444','#f97316','#eab308','#22c55e','#16a34a'];
    if(pw && fill) {
        pw.addEventListener('input', function() {
            const val = pw.value;
            let score = 0;
            if(val.length >= 8) score++;
            if(/[A-Z]/.test(val)) score++;
            if(/[0-9]/.test(val)) score++;
            if(/[^A-Za-z0-9]/.test(val)) score++;
            fill.style.width = (score * 25) + '%';
            fill.style.background = colors[score] || '#ef4444';
        });
    }
</script>
</body>
</html>
