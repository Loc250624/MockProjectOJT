# Production Environment Profile for Railway (SPRING_PROFILES_ACTIVE=prod)

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

app.seed.enabled=${APP_SEED_ENABLED:false}

app.security.cookie-secure=${APP_SECURITY_COOKIE_SECURE:true}
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION_MS:86400000}

app.base-url=${APP_BASE_URL}

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:${APP_BASE_URL}}

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID:}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET:}
spring.security.oauth2.client.registration.github.scope=read:user,user:email

payment.gateway.momo.partnerCode=${MOMO_PARTNER_CODE:}
payment.gateway.momo.accessKey=${MOMO_ACCESS_KEY:}
payment.gateway.momo.secretKey=${MOMO_SECRET_KEY:}
payment.gateway.momo.endpoint=${MOMO_ENDPOINT:https://test-payment.momo.vn/v2/gateway/api/create}
payment.gateway.momo.returnUrl=${app.base-url}/student/payment-result
payment.gateway.momo.ipnUrl=${app.base-url}/api/payment/webhook

payment.gateway.vnpay.tmnCode=${VNPAY_TMN_CODE:}
payment.gateway.vnpay.hashSecret=${VNPAY_HASH_SECRET:}
payment.gateway.vnpay.endpoint=${VNPAY_ENDPOINT:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
payment.gateway.vnpay.returnUrl=${app.base-url}/student/payment-result
payment.gateway.vnpay.ipnUrl=${app.base-url}/api/payment/vnpay-ipn

payment.gateway.exchange-rate=${PAYMENT_EXCHANGE_RATE:25000}

app.ai-tutor.enabled=${AI_TUTOR_ENABLED:true}
app.ai-tutor.api-key=${OPENAI_API_KEY:}
app.ai-tutor.base-url=${OPENAI_BASE_URL:https://api.openai.com/v1}
app.ai-tutor.model=${OPENAI_MODEL:gpt-4o-mini}

server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false
