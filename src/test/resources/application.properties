# Test Profile Configuration for Unit and Integration Tests (H2 In-Memory Database)

spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

app.seed.enabled=false

app.security.cookie-secure=false
jwt.secret=dev-only-local-test-secret-key-minimum-256-bits
jwt.expiration=86400000

app.base-url=http://localhost:8080

spring.security.oauth2.client.registration.google.client-id=test-google-client-id.apps.googleusercontent.com
spring.security.oauth2.client.registration.google.client-secret=
spring.security.oauth2.client.registration.google.scope=openid,profile,email

spring.security.oauth2.client.registration.github.client-id=test-github-client-id
spring.security.oauth2.client.registration.github.client-secret=
spring.security.oauth2.client.registration.github.scope=read:user,user:email

