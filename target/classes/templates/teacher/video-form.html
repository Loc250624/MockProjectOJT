<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${editMode != null && editMode ? 'Edit Video' : 'Add Video'} + ' — Teacher Portal | LumiNa'">Video Form | LumiNa</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/lumina-design-system.css}">
    <link rel="stylesheet" th:href="@{/css/teacher/teacher.css}">
</head>
<body>

<div class="lumina-portal">
    <aside th:replace="~{fragments/layout :: sidebar-teacher}"></aside>

    <div class="lumina-portal-content" style="display:flex;flex-direction:column;min-height:100vh;">
        <div th:replace="~{fragments/layout :: topbar-teacher('Video Form')}"></div>

        <main class="lumina-portal-main" style="flex:1;">

            <!-- Breadcrumb -->
            <div style="display:flex;align-items:center;gap:0.5rem;font-size:0.875rem;color:var(--lumina-gray-500);margin-bottom:1.5rem;">
                <a th:href="@{/teacher/lessons(courseId=${courseId})}" style="color:var(--lumina-blue);text-decoration:none;">Curriculum</a>
                <span>›</span>
                <a th:href="@{'/teacher/videos?lessonId=' + ${lessonId} + '&courseId=' + ${courseId}}" style="color:var(--lumina-blue);text-decoration:none;">Video Management</a>
                <span>›</span>
                <span th:text="${editMode != null && editMode ? 'Edit Video' : 'Add Video'}">Add Video</span>
            </div>

            <!-- Page header -->
            <div class="page-header" style="display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:1.5rem;">
                <div>
                    <h1 class="page-title" th:text="${editMode != null && editMode ? 'Edit Video' : 'Add Video URL'}">Add Video</h1>
                    <p class="page-subtitle" th:if="${selectedLesson != null}">
                        Lesson: <strong th:text="${selectedLesson.title}"></strong>
                        <span th:if="${selectedCourse != null}"> &mdash; Course: <span th:text="${selectedCourse.title}"></span></span>
                    </p>
                </div>
                <a th:href="@{'/teacher/videos?lessonId=' + ${lessonId} + '&courseId=' + ${courseId}}"
                   class="btn btn-outline">← Back to Video Management</a>
            </div>

            <!-- Flash messages -->
            <div th:if="${errorMessage}" style="margin-bottom:1rem;padding:0.75rem 1rem;background:#fef2f2;border:1px solid #fca5a5;border-radius:8px;color:#dc2626;font-size:0.875rem;font-weight:500;" th:text="${errorMessage}"></div>
            <div th:if="${infoMessage}" style="margin-bottom:1rem;padding:0.75rem 1rem;background:#eff6ff;border:1px solid #93c5fd;border-radius:8px;color:#1d4ed8;font-size:0.875rem;font-weight:500;" th:text="${infoMessage}"></div>

            <!-- Form Card -->
            <div class="admin-table-container" style="padding:2rem;max-width:680px;">

                <form th:action="${editMode != null && editMode
                                   ? '/teacher/videos/edit/' + videoId
                                   : '/teacher/videos/create'}"
                      th:object="${video}"
                      method="post">

                    <!-- Hidden fields -->
                    <input type="hidden" th:field="*{lessonId}" />
                    <input type="hidden" name="courseId" th:value="${courseId}" />

                    <!-- Video URL -->
                    <div class="form-group" style="margin-bottom:1.5rem;">
                        <label class="form-label" for="videoUrl">
                            VIDEO URL <span style="color:var(--lumina-danger);">*</span>
                        </label>
                        <input
                            id="videoUrl"
                            type="url"
                            class="form-control"
                            th:field="*{videoUrl}"
                            placeholder="https://www.youtube.com/watch?v=..."
                            style="width:100%;"
                        >
                        <div th:if="${#fields.hasErrors('videoUrl')}"
                             th:errors="*{videoUrl}"
                             style="margin-top:0.35rem;font-size:0.8125rem;color:var(--lumina-danger);"></div>
                        <p style="margin-top:0.35rem;font-size:0.8125rem;color:var(--lumina-gray-500);">
                            Must start with <code>http://</code> or <code>https://</code>. Supports YouTube, Vimeo, or any public URL.
                        </p>
                    </div>

                    <!-- Duration (seconds) -->
                    <div class="form-group" style="margin-bottom:2rem;">
                        <label class="form-label" for="durationSeconds">
                            DURATION (SECONDS) <span style="color:var(--lumina-danger);">*</span>
                        </label>
                        <input
                            id="durationSeconds"
                            type="number"
                            class="form-control"
                            th:field="*{durationSeconds}"
                            placeholder="e.g. 900 (= 15 minutes)"
                            min="1"
                            style="width:100%;"
                        >
                        <div th:if="${#fields.hasErrors('durationSeconds')}"
                             th:errors="*{durationSeconds}"
                             style="margin-top:0.35rem;font-size:0.8125rem;color:var(--lumina-danger);"></div>
                        <p style="margin-top:0.35rem;font-size:0.8125rem;color:var(--lumina-gray-500);">
                            Enter the total length of the video in seconds. 60 = 1 minute, 3600 = 1 hour.
                        </p>
                    </div>

                    <!-- Actions -->
                    <div style="display:flex;gap:0.75rem;">
                        <button type="submit" class="btn btn-primary" style="flex:1;">
                            <span th:text="${editMode != null && editMode ? '💾 Save Changes' : '+ Add Video'}">Save</span>
                        </button>
                        <a th:href="@{'/teacher/videos?lessonId=' + ${lessonId} + '&courseId=' + ${courseId}}"
                           class="btn btn-outline" style="flex:1;text-align:center;">Cancel</a>
                    </div>

                </form>
            </div>

        </main>

        <div th:replace="~{fragments/layout :: portal-footer}"></div>
    </div>
</div>

<script th:src="@{/js/teacher/teacher.js}"></script>
</body>
</html>
