<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Category Management — Admin Portal | LumiNa</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@1,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/lumina-design-system.css}">
    <link rel="stylesheet" th:href="@{/css/admin/admin.css}">
</head>
<body>

<div class="lumina-portal">
    <aside th:replace="~{fragments/layout :: sidebar-admin}"></aside>

    <div class="lumina-portal-content" style="display:flex;flex-direction:column;min-height:100vh;">
        <div th:replace="~{fragments/layout :: topbar-admin('Categories')}"></div>

        <main class="lumina-portal-main" style="flex:1;">
            <div class="page-header" style="display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:1.5rem;">
                <div>
                    <h1 class="page-title">Category Management</h1>
                    <p class="page-subtitle">Create, edit and manage course categories across the platform.</p>
                </div>
                <a th:href="@{/admin/categories/create}" class="btn btn-primary" id="btn-add-category">
                    + Add Category
                </a>
            </div>

            <!-- Flash messages -->
            <div th:if="${successMessage}" class="badge badge-success" style="margin-bottom:1rem;display:block;padding:0.65rem 1rem;border-radius:8px;font-size:0.875rem;font-weight:500;text-transform:none;" th:text="${successMessage}"></div>
            <div th:if="${errorMessage}" class="badge badge-danger" style="margin-bottom:1rem;display:block;padding:0.65rem 1rem;border-radius:8px;font-size:0.875rem;font-weight:500;text-transform:none;" th:text="${errorMessage}"></div>

            <!-- Categories Table -->
            <div class="admin-table-container">
                <div class="admin-table-toolbar">
                    <div>
                        <span style="font-weight:600;font-size:0.875rem;color:var(--lumina-gray-800);">
                            All Categories
                            <span th:text="'(' + ${#lists.size(categories)} + ')'" style="color:var(--lumina-gray-500);font-weight:400;"></span>
                        </span>
                    </div>
                    <div class="table-search">
                        <input type="text" id="categorySearch" placeholder="Search categories..." oninput="filterTable(this.value)">
                    </div>
                </div>
                <table class="data-table" style="width:100%;border-collapse:collapse;">
                    <thead>
                        <tr>
                            <th style="padding:0.75rem 1.5rem;text-align:left;font-size:0.75rem;font-weight:600;color:var(--lumina-gray-500);text-transform:uppercase;letter-spacing:0.05em;border-bottom:1px solid var(--lumina-gray-200);">ID</th>
                            <th style="padding:0.75rem 1.5rem;text-align:left;font-size:0.75rem;font-weight:600;color:var(--lumina-gray-500);text-transform:uppercase;letter-spacing:0.05em;border-bottom:1px solid var(--lumina-gray-200);">Name</th>
                            <th style="padding:0.75rem 1.5rem;text-align:left;font-size:0.75rem;font-weight:600;color:var(--lumina-gray-500);text-transform:uppercase;letter-spacing:0.05em;border-bottom:1px solid var(--lumina-gray-200);">Description</th>
                            <th style="padding:0.75rem 1.5rem;text-align:left;font-size:0.75rem;font-weight:600;color:var(--lumina-gray-500);text-transform:uppercase;letter-spacing:0.05em;border-bottom:1px solid var(--lumina-gray-200);">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="categoryTableBody">
                        <tr th:each="cat : ${categories}"
                            style="border-bottom:1px solid var(--lumina-gray-100);transition:background 0.15s;">
                            <td style="padding:1rem 1.5rem;font-size:0.875rem;color:var(--lumina-gray-500);font-family:monospace;" th:text="${cat.id}">1</td>
                            <td style="padding:1rem 1.5rem;">
                                <span style="font-size:0.875rem;font-weight:600;color:var(--lumina-gray-900);" th:text="${cat.name}">Category Name</span>
                            </td>
                            <td style="padding:1rem 1.5rem;font-size:0.875rem;color:var(--lumina-gray-600);max-width:400px;" th:text="${cat.description}">Description</td>
                            <td style="padding:1rem 1.5rem;">
                                <div style="display:flex;gap:0.5rem;align-items:center;">
                                    <a th:href="@{'/admin/categories/edit/' + ${cat.id}}"
                                       class="btn btn-secondary btn-sm"
                                       th:id="'btn-edit-cat-' + ${cat.id}">Edit</a>
                                    <form th:action="@{'/admin/categories/delete/' + ${cat.id}}" method="post" style="display:inline;"
                                          onsubmit="return confirm('Are you sure you want to delete this category?');">
                                        <button type="submit" class="btn btn-sm"
                                                style="background:var(--lumina-danger-bg);color:var(--lumina-danger);border:1px solid #fca5a5;"
                                                th:id="'btn-delete-cat-' + ${cat.id}">Delete</button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(categories)}">
                            <td colspan="4" style="padding:3rem;text-align:center;color:var(--lumina-gray-400);font-style:italic;">
                                No categories found. <a th:href="@{/admin/categories/create}" style="color:var(--lumina-blue);">Create your first category →</a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </main>

        <div th:replace="~{fragments/layout :: portal-footer}"></div>
    </div>
</div>

<script th:src="@{/js/admin/admin.js}"></script>
<script>
function filterTable(query) {
    const rows = document.querySelectorAll('#categoryTableBody tr');
    const q = query.toLowerCase();
    rows.forEach(row => {
        const text = row.textContent.toLowerCase();
        row.style.display = text.includes(q) ? '' : 'none';
    });
}
</script>
</body>
</html>
