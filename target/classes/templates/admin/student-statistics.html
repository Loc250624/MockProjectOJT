<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Statistics - Admin - OJTSU26 E-Learning</title>
    <link rel="stylesheet" th:href="@{/css/admin/admin.css}">
</head>
<body>
    <header th:replace="~{fragments/layout :: header('admin')}"></header>
    <div class="layout-container">
        <aside th:replace="~{fragments/layout :: sidebar-admin}"></aside>
        <main class="main-content">
            <h1>Student Statistics</h1>
            <div class="stats-grid"><div class="stat-card"><h3>Total Students</h3><div class="value">100</div></div><div class="stat-card"><h3>Active Students</h3><div class="value">80</div></div><div class="stat-card"><h3>New This Month</h3><div class="value">15</div></div></div><div class="chart-placeholder">Student Growth</div>
        </main>
    </div>
    <footer th:replace="~{fragments/layout :: footer}"></footer>
    <script th:src="@{/js/admin/admin.js}"></script>
</body>
</html>
