<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Chatbot desired behavior</title>
  <link rel="stylesheet" href="ai-chatbot-desired.css">
</head>
<body>
  <main>
    <h1>Example website page</h1>
    <p>The chatbot icon is globally mounted and remains available on every page.</p>
  </main>

  <button id="chat-launcher" class="chat-launcher"
          aria-label="Open AI Chatbot" aria-expanded="true">AI</button>

  <aside id="chat-panel" class="chat-panel" aria-label="AI Chatbot">
    <header class="chat-header">
      <h2>AI Chatbot</h2>
      <button id="chat-close" aria-label="Close AI Chatbot">×</button>
    </header>

    <section id="messages" class="messages" aria-live="polite">
      <article class="assistant-message">
        <strong>AI CHATBOT</strong>
        <p>
          I’m ready to help you use this website. You can ask about courses,
          lessons, quizzes, coding assignments, certificates, enrollment,
          payments, or the page you are viewing.
        </p>
      </article>

      <div id="quick-actions" class="quick-actions" aria-label="Quick questions">
        <button data-prompt="Summarize this page">Summarize this page</button>
        <button data-prompt="Explain this page simply">Explain this page simply</button>
        <button data-prompt="Show me how to use this feature">How do I use this?</button>
        <button data-prompt="Quiz me on what I’m learning">Quiz me</button>
      </div>
    </section>

    <form id="composer" class="composer">
      <textarea id="message" placeholder="Ask about this website" required></textarea>
      <button type="submit" aria-label="Send message">Send</button>
    </form>
  </aside>

  <script src="ai-chatbot-desired.js"></script>
</body>
</html>
